<!doctype html><html lang="en"><meta charset="utf-8"><title>Product modal matrix</title><style>body{font:14px system-ui;padding:22px}pre{white-space:pre-wrap;background:#f2f4ef;padding:14px}</style><h1>Product details: all products and sort conditions</h1><pre id="results">Running…</pre><iframe id="site" src="./showroom.html?qa=modals-all-v17-af5bdd" style="width:100%;height:450px"></iframe>
<script>
(async()=>{
 const frame=document.getElementById('site'),out=document.getElementById('results');
 const sleep=ms=>new Promise(r=>setTimeout(r,ms));
 for(let i=0;i<130;i++){if(frame.contentDocument?.querySelectorAll('.product-card').length>=6)break;await sleep(110)}
 const doc=frame.contentDocument,win=frame.contentWindow,dialog=doc.getElementById('productDialog'),results=[],events=[];
 const nativeShow=dialog.showModal.bind(dialog),nativeClose=dialog.close.bind(dialog);
 dialog.showModal=()=>{events.push('show');return nativeShow()};
 dialog.close=()=>{events.push('close');return nativeClose()};
 const queryAll=()=>Array.from(doc.querySelectorAll('.product-card'));
 async function clickAll(stage){
  const count=queryAll().length;
  for(let i=0;i<count;i++){
   const card=queryAll()[i],name=card.querySelector('h3')?.textContent,button=card.querySelector('.product-actions button:last-child');
   events.length=0;let exception='';
   try{button.click()}catch(e){exception=e.message}
   const instant=dialog.open;
   await sleep(620);
   const delayed=dialog.open;
   results.push({stage,i,name,handler:typeof button.onclick,openedInstant:instant,openedAfter620ms:delayed,events:[...events],exception,hasDetail:doc.getElementById('productDetail')?.firstElementChild?.className});
   if(dialog.open)dialog.close();
  }
 }
 await clickAll('all recent');
 doc.querySelector('[data-category="medal"]').click();await sleep(100);
 for(const key of ['low','high']){
  const sort=doc.getElementById('sortSelect');sort.value=key;sort.dispatchEvent(new Event('change',{bubbles:true}));await sleep(100);await clickAll('medal '+key);
 }
 out.textContent=JSON.stringify(results,null,2);
})();
</script></html>
