name = "wholesale-desk-ops"
main = "src/worker.js"
compatibility_date = "2026-11-17"
workers_dev = true
keep_vars = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "wholesale_desk"
database_id = "bd8cf752-3c5a-40b5-a8a8-2956d00a34c8"
migrations_dir = "migrations"

# Set ACCESS_TEAM_DOMAIN, ACCESS_AUD and AUTHORIZED_EMAILS in the Worker dashboard.
# keep_vars preserves those dashboard values across Git-based deployments.
# SELLER_CODE (Worker secret) is this desk's seller code, the front of every document number: LL-INV-2026-0002 for Lotus Labs.
