function syncLabel(){const el=document.getElementById('syncLabel');if(!el)return;el.textContent=syncLocked?'⛔ NOT SAVED — '+(cloudSaveError||'backup & reload'):!cloudReady?'Connecting…':(dirtySnapshot||saveInFlight)?'↻ Saving to D1…':'✓ D1 saved · revision '+serverRevision; el.style.color=syncLocked?'#ffad9f':(dirtySnapshot||saveInFlight)?'#ffe2a5':'#bce6d5';}
async function cloudJSON(path,opts={}){const res=await fetch(path,{cache:'no-store',credentials:'same-origin',...opts});let body;try{body=await res.json()}catch{throw Error('Unexpected server response. Check Cloudflare Access sign-in.')}if(!res.ok)throw Error(body.error||'Server error');return body;}
async function connectCloud(){try{const who=await cloudJSON('/api/session');me={email:String(who.email||'').toLowerCase(),name:String(who.name||'')};team=Array.isArray(who.team)?who.team:[];const x=await cloudJSON('/api/workspace');serverRevision=x.revision;data=Object.assign(initial(),x.state||{});ensureDefaults();whoLabel();cloudReady=true;storageOk=true;syncLabel();render();if(!data.products.length)notify('Cloud workspace ready · import private supplier catalog JSON.');}catch(e){syncLocked=true;syncLabel();document.getElementById('view').innerHTML='<div class="card"><h2>Cloud workspace unavailable</h2><div class="notice error">'+escapeHTML(e.message)+'</div><p>Verify Access policy, Worker variables, and D1 binding. No data has been saved.</p><button class="btn primary" onclick="location.reload()">Retry</button></div>';}}
async function persistSnapshot(){if(saveInFlight||syncLocked||!cloudReady||!dirtySnapshot)return;saveInFlight=true;syncLabel();try{while(dirtySnapshot&&!syncLocked){const snapshot=dirtySnapshot;dirtySnapshot=null;const x=await cloudJSON('/api/workspace',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision:serverRevision,state:snapshot})});serverRevision=x.revision;}}catch(e){syncLocked=true;cloudSaveError=e.message;notify('Cloud save blocked · export backup.');alert('Recent edits were NOT saved to Cloudflare.\n'+e.message+'\nDownload Backup before reloading to reconcile.');}finally{saveInFlight=false;syncLabel();}}

function seedSupplierCatalog(){const existing=new Set(data.products.map(p=>String(p.sku).toLowerCase()));let added=0;
for(const x of RAW_SUPPLIER_SKUS){const [row,sku,name,spec,costUSD,costTHB,needsSKU]=x;if(existing.has(String(sku).toLowerCase()))continue;
 data.products.push({id:'supplier-'+row,sku,name,spec,unit:'vial',packCount:10,costUSDPack:costUSD,costTHBPack:costTHB,priceTHB:0,priceUSD:0,wholesaleMarkupOverride:'',retailMarkupOverride:'',moqOverride:'',wholesaleTHBOverride:'',retailTHBOverride:'',wholesaleUSDOverride:'',retailUSDOverride:'',sourceNote:needsSKU?'Supplier PDF has no SKU at row 63. Replace this internal placeholder after confirmation.':'Supplier price list 29 Sep 2026',sourceRow:row,defaultLot:'',expiry:'',coa:''});existing.add(String(sku).toLowerCase());added++;}
 data.pricing={...defaultPricing(),...(data.pricing||{})};data.sourceListVersion=SUPPLIER_LIST_DATE; if(added)save();return added}

function markupToMargin(markup){return 100*nval(markup)/(100+nval(markup))}
function marginToMarkup(margin){if(!Number.isFinite(margin)||margin<0||margin>95)throw Error('Margin must be between 0% and 95%.');return 100*margin/(100-margin)}
function shownMargin(markup){return Math.round(markupToMargin(markup)*10000)/10000}
function priceSettings(){return state.pricingDraft||data.pricing}
function pricingDirty(){return !!state.pricingDraft&&JSON.stringify(state.pricingDraft)!==JSON.stringify(data.pricing)}
function marginCard(channel,title){const margin=shownMargin(priceSettings()[channel+'Markup']);return `<section class="margin-card"><h3>${title}</h3><p>Profit kept from each sale, after product costs.</p><label for="${channel}Margin">Target gross margin</label><div class="margin-entry"><input id="${channel}Margin" data-margin="${channel}" type="number" min="0" max="95" step="any" value="${margin}" required aria-describedby="${channel}Example"><span>%</span></div><div class="margin-presets">${[20,30,40,50,60].map(n=>`<button type="button" class="btn small" data-act="margin-preset" data-channel="${channel}" data-value="${n}">${n}%</button>`).join('')}</div><p id="${channel}Example" class="margin-example">For every ฿100 sold, keep ฿${amount(margin)} before other expenses and tax. Rounding may increase this.</p></section>`}
function refreshMarginExamples(){for(const channel of ['wholesale','retail']){const el=document.getElementById(channel+'Example');if(el){const m=markupToMargin(priceSettings()[channel+'Markup']);el.textContent=`For every ฿100 sold, keep ฿${amount(m)} before other expenses and tax. Rounding may increase this.`}}}

function applyPricing(){const f=document.getElementById('pricingForm');if(!f.reportValidity())return;data.pricing={...priceSettings()};state.pricingDraft={...data.pricing};save();refreshPricingSave();notify('Saving prices for everyone…');}

const clamp=(n,min,max)=>Math.max(min,Math.min(max,nval(n)));
function effectiveMarkup(p,channel,settings=data.pricing){const key=channel==='retail'?'retailMarkupOverride':'wholesaleMarkupOverride';const v=p[key];return v===''||v===null||v===undefined?clamp(settings[channel==='retail'?'retailMarkup':'wholesaleMarkup'],0,2000):clamp(v,0,2000)}
function effectiveMOQ(p,settings=data.pricing){return Math.max(1,Math.floor(nval(p.moqOverride!==''&&p.moqOverride!==undefined&&p.moqOverride!==null?p.moqOverride:settings.wholesaleMOQ)||1))}
function unitLandedCost(p,currency='THB',settings=data.pricing){const pack=Math.max(1,nval(p.packCount)||10);const hasSupplierCost=nval(p.costUSDPack)>0||nval(p.costTHBPack)>0;if(!hasSupplierCost)return 0;
 const fx=clamp(settings.fxTHBPerUSD,1,1000),feesUSD=clamp(settings.testingUSDPerPack,0,1e7)+clamp(settings.freightUSDPerPack,0,1e7)+clamp(settings.handlingUSDPerPack,0,1e7);
 let packCost=currency==='USD'?nval(p.costUSDPack):(settings.thbCostBasis==='fx'?nval(p.costUSDPack)*fx:nval(p.costTHBPack));
 return amount((packCost+(currency==='USD'?feesUSD:feesUSD*fx))/pack)}
function roundUP(raw,step){if(raw<=0)return 0;step=Math.max(.01,nval(step)||1);return amount(Math.ceil((raw-1e-8)/step)*step)}
function pricingForProduct(p,channel='wholesale',currency='THB',settings=data.pricing){const costUnit=unitLandedCost(p,currency,settings);const markup=effectiveMarkup(p,channel,settings);const overrideKey=(channel==='retail'?'retail':'wholesale')+currency+'Override';const override=p[overrideKey];let price,origin;
 if(override!==''&&override!==undefined&&override!==null&&nval(override)>0){price=amount(override);origin='manual override'}
 else if(costUnit>0){const roundingKey='round'+currency+(channel==='retail'?'Retail':'Wholesale');price=roundUP(costUnit*(1+markup/100),settings[roundingKey]);origin='rounded markup'}
 else {price=amount(currency==='THB'?p.priceTHB:p.priceUSD);origin='legacy price'}
 return {price,costUnit,markup,origin,customMargin:p[channel+'MarkupOverride']!==''&&p[channel+'MarkupOverride']!=null,realizedMarkup:costUnit>0?amount((price/costUnit-1)*100):null,grossMargin:price>0&&costUnit>0?amount((price-costUnit)/price*100):null,moq:effectiveMOQ(p,settings)}}
function wholesaleMOQViolations(d){if(d.salesChannel!=='wholesale')return [];return (d.items||[]).flatMap(r=>{if(!r.productId)return [];const p=getProduct(r.productId);if(!p)return [];const min=effectiveMOQ(p);return nval(r.qty)+1e-8<min?[`${r.sku||p.sku}: ${r.qty} vial(s), minimum ${min}`]:[]})}
function repriceDocumentCatalogLines(){if(!state.draft||readonly())return;for(const row of state.draft.items){const p=getProduct(row.productId);if(!p)continue;const r=pricingForProduct(p,state.draft.salesChannel||'wholesale',state.draft.currency);row.unitPrice=r.price;row.costSnapshot=r.costUnit;row.priceOrigin=r.origin;if((state.draft.salesChannel||'wholesale')==='wholesale'&&nval(row.qty)<r.moq)row.qty=r.moq}if(state.draft.shippingOptionId&&state.draft.shippingOptionId!=='custom'){state.draft.shippingManual=false;applyShipping(state.draft)}refreshLines()}

function lineTotal(row){return amount(nval(row.qty)*nval(row.unitPrice)*(1-Math.min(100,Math.max(0,nval(row.discount)))/100))}
function totals(doc){const subtotal=amount((doc.items||[]).reduce((s,r)=>s+lineTotal(r),0));const shipping=amount(Math.max(0,nval(doc.shippingAmount)));const vat=doc.vatEnabled?amount((subtotal+shipping)*nval(doc.vatRate)/100):0;const total=amount(subtotal+shipping+vat);const paid=amount((doc.payments||[]).reduce((s,p)=>s+nval(p.amount),0));return {subtotal,shipping,vat,total,paid,due:amount(total-paid)}}
function status(doc){if(doc.status==='void')return 'void';if(doc.status==='draft')return 'draft';if(doc.type!=='invoice')return 'sent';const t=totals(doc);if(t.due<=.009)return 'paid';if(doc.dueDate&&doc.dueDate<today())return 'overdue';if(t.paid>0)return 'partial';return 'unpaid'}

function field(name,inner){return `<div class="field"><label>${name}</label>${inner}</div>`}
function renderLines(){const d=state.draft,issued=readonly(),disabled=issued?'disabled':'';if(!d.items.length)return `<div class="empty" style="padding:22px"><strong>No items added</strong><p>Choose an item from the catalog or add a custom charge.</p>${!issued?btn('add-item','＋ Add first item','primary'):''}</div>`;
return `<div class="table-scroll"><table class="line-table"><thead><tr><th>Catalog</th><th>SKU / description</th><th>Lot / batch</th><th>Expiry / CoA</th><th>Qty</th><th>Unit</th><th>Unit price</th><th>Disc %</th><th class="right">Amount</th><th></th></tr></thead><tbody>${d.items.map((row,i)=>`<tr data-line="${i}"><td><select aria-label="Catalog product ${i+1}" data-item="productId" ${disabled} style="width:130px"><option value="">Custom</option>${products().map(p=>`<option value="${h(p.id)}" ${p.id===row.productId?'selected':''}>${h(p.sku)}</option>`).join('')}</select></td><td><input class="code" aria-label="SKU ${i+1}" data-item="sku" value="${h(row.sku)}" placeholder="SKU" ${disabled}><input style="margin-top:4px" class="item-main" aria-label="Description ${i+1}" data-item="description" value="${h(row.description)}" placeholder="Description and specification" ${disabled}></td><td><input style="min-width:100px" aria-label="Lot number ${i+1}" data-item="lot" value="${h(row.lot)}" placeholder="Lot ID" ${disabled}></td><td><input type="date" style="min-width:128px" aria-label="Expiry ${i+1}" data-item="expiry" value="${h(row.expiry)}" ${disabled}><input class="url" style="margin-top:4px" aria-label="CoA URL ${i+1}" data-item="coa" value="${h(row.coa)}" placeholder="https://... CoA" ${disabled}></td><td><input type="number" min="0.0001" step="any" class="small-field" aria-label="Quantity ${i+1}" data-item="qty" value="${h(row.qty)}" ${disabled}>${!issued&&d.salesChannel!=='retail'&&row.productId&&nval(row.qty)<effectiveMOQ(getProduct(row.productId)||{})?`<span class="qty-warning">MOQ ${effectiveMOQ(getProduct(row.productId)||{})} vials</span>`:''}</td><td><input class="tiny-field" aria-label="Unit ${i+1}" data-item="unit" value="${h(row.unit)}" ${disabled}></td><td><input type="number" step="0.01" min="0" class="small-field" aria-label="Unit price ${i+1}" data-item="unitPrice" value="${h(row.unitPrice)}" ${disabled}></td><td><input type="number" min="0" max="100" step="0.1" class="tiny-field" aria-label="Discount ${i+1}" data-item="discount" value="${h(row.discount)}" ${disabled}></td><td class="right" style="white-space:nowrap" data-row-amount="${i}">${fmt(lineTotal(row),d.currency)}</td><td>${!issued?`<button class="btn small danger" aria-label="Remove line ${i+1}" data-act="remove-item" data-index="${i}">×</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}
function renderTotals(d){const t=totals(d);return `<div class="money-block"><div class="money-row"><span>Subtotal</span><strong>${fmt(t.subtotal,d.currency)}</strong></div>${t.shipping>0||d.shippingMethod?`<div class="money-row"><span>Shipping${d.shippingMethod?' · '+h(d.shippingMethod):''}</span><strong>${fmt(t.shipping,d.currency)}</strong></div>`:''}<div class="money-row"><span>VAT (${d.vatEnabled?`${nval(d.vatRate)}%`:'not applied'})</span><strong>${fmt(t.vat,d.currency)}</strong></div><div class="money-row total"><span>Total</span><strong>${fmt(t.total,d.currency)}</strong></div>${d.type==='invoice'?`<div class="money-row"><small>Payments recorded</small><strong>${fmt(t.paid,d.currency)}</strong></div><div class="money-row due"><span>Balance due</span><strong>${fmt(Math.max(0,t.due),d.currency)}</strong></div>`:''}</div>`}
function renderPayments(d){const t=totals(d);return `${d.payments.length?`<div class="stack">${d.payments.map(p=>`<div class="keyline"><div><strong>${fmt(p.amount,d.currency)}</strong><div class="footnote">${p.receiptNumber?h(p.receiptNumber)+' · ':''}${labelDate(p.date)} · ${h(p.method)} ${p.reference?'· '+h(p.reference):''}${p.by?' · '+h(personName(p.by)):''}</div></div><button class="linkbtn" data-act="print-receipt" data-id="${h(d.id)}" data-pay="${h(p.id)}">Receipt</button></div>`).join('')}</div>`:'<p class="muted smalltext">No payments yet.</p>'}<div class="divider"></div><div class="keyline"><strong>Remaining</strong><strong class="display-amount">${fmt(Math.max(0,t.due),d.currency)}</strong></div>${d.status==='issued'&&t.due>.009?`<div style="margin-top:12px">${btn('new-payment','＋ Record payment','primary small')}</div>`:''}`}
function refreshLines(){const s=document.getElementById('lineSection');if(s)s.innerHTML=renderLines();refreshTotals()}
function refreshTotals(){const d=state.draft;if(!d)return;refreshShipping();const el=document.getElementById('totalsSection');if(el)el.innerHTML=renderTotals(d);document.querySelectorAll('[data-row-amount]').forEach(x=>x.textContent=fmt(lineTotal(d.items[nval(x.dataset.rowAmount)]),d.currency));}
function setCustomer(id){const d=state.draft;d.customerId=id;const c=getCustomer(id);if(c){d.customerName=c.name;d.customerAddress=c.address||'';d.customerTaxId=c.taxId||'';d.customerEmail=c.email||'';d.shippingAddress=c.shipping||c.address||'';d.currency=c.currency||data.settings.defaultCurrency||'THB';d.salesChannel=c.salesChannel||'wholesale';d.dueDate=plusDays(d.issueDate,nval(c.terms??data.settings.defaultTerms));d.terms=`Payment due within ${nval(c.terms??data.settings.defaultTerms)} days.`;for(const row of d.items){const p=getProduct(row.productId);if(!p)continue;const r=pricingForProduct(p,d.salesChannel,d.currency);row.unitPrice=r.price;row.costSnapshot=r.costUnit;if(d.salesChannel==='wholesale'&&nval(row.qty)<r.moq)row.qty=r.moq}}else{d.customerName='';d.customerAddress='';d.customerTaxId='';d.customerEmail='';d.shippingAddress=''}render()}
function setProduct(i,id){const d=state.draft,row=d.items[i],p=getProduct(id);if(!row)return;row.productId=id;if(p){row.sku=p.sku;row.description=p.name+(p.spec?' · '+p.spec:'');row.unit=p.unit||'vial';const pr=pricingForProduct(p,d.salesChannel||'wholesale',d.currency);row.unitPrice=pr.price;row.costSnapshot=pr.costUnit;row.priceOrigin=pr.origin;if(d.salesChannel!=='retail'&&nval(row.qty)<pr.moq)row.qty=pr.moq;row.lot=p.defaultLot||'';row.expiry=p.expiry||'';row.coa=p.coa||''}refreshLines()}
function validateIssue(d){if(!data.settings.sellerName.trim())return 'Add your seller business name in Settings.';if(!data.settings.sellerAddress.trim())return 'Add your seller billing address in Settings.';if(!d.customerName.trim()||!d.customerAddress.trim())return 'Select a customer with a billing address.';if(!d.items.length)return 'Add at least one line item.';if(d.items.some(i=>!i.description.trim()||nval(i.qty)<=0||nval(i.unitPrice)<0))return 'Every item needs a description, positive quantity and valid unit price.';if(d.vatEnabled&&!data.settings.vatRegistered)return 'VAT cannot be applied until VAT registration is enabled in Settings.';if(d.vatEnabled&&(!data.settings.sellerTaxId||!data.settings.sellerTaxId.trim()))return 'Add the seller tax identification number to apply VAT.';if(!d.issueDate||!d.dueDate)return 'Both dates are required.';if(d.items.some(i=>nval(i.discount)<0||nval(i.discount)>100))return 'Discount must be between 0% and 100%.';if(d.shippingOptionId==='custom'&&!String(d.shippingMethod||'').trim())return 'Name the shipping method, or choose No shipping.';if(nval(d.shippingAmount)<0)return 'Shipping charge cannot be negative.';const violations=wholesaleMOQViolations(d);if(violations.length)return 'Wholesale MOQ not met (per SKU):\n'+violations.join('\n');return ''}
function commitDraft(issue=false){const d=state.draft;if(!d||d.status!=='draft')return;const err=issue?validateIssue(d):'';if(err){alert(err);return}if(issue&&!confirm(`Issue this ${typename[d.type].toLowerCase()}? The amount and line items will be locked.`))return;
const existing=getDoc(d.id);const copy=structuredClone(d);copy.updatedAt=new Date().toISOString();if(issue){copy.status='issued';copy.number=nextNumber(copy.type,copy.issueDate);events(copy,'Issued '+copy.number)}else events(copy,existing?'Draft updated':'Draft created');if(existing)Object.assign(existing,copy);else data.documents.push(copy);save();state.draft=structuredClone(copy);render();notify(issue?`Issued ${copy.number}`:'Draft saved')}
function openDoc(id){const d=getDoc(id);if(!d)return;state.draft=structuredClone(d);state.tab='documents';render()}
function duplicateDoc(id){const d=id?getDoc(id):state.draft;if(!d)return;const clone=structuredClone(d);clone.id=uid();clone.status='draft';clone.number='';clone.payments=[];clone.history=[];delete clone.delivery;clone.createdAt=new Date().toISOString();clone.updatedAt=clone.createdAt;clone.issueDate=today();clone.dueDate=plusDays(today(),nval(data.settings.defaultTerms));state.draft=clone;state.tab='documents';render();notify('Editable copy created. Save when ready.')}
function convertDoc(id){const d=id?getDoc(id):state.draft;if(!d||d.type==='invoice')return;const copy=structuredClone(d);copy.id=uid();copy.type='invoice';copy.status='draft';copy.number='';copy.reference=d.number||d.reference||'';copy.payments=[];copy.history=[];delete copy.delivery;copy.issueDate=today();copy.dueDate=plusDays(today(),nval(data.settings.defaultTerms));copy.createdAt=new Date().toISOString();copy.updatedAt=copy.createdAt;state.draft=copy;state.tab='documents';render();notify('Quotation converted to a draft invoice.')}
function voidCurrent(){const d=state.draft;if(!d||d.status!=='issued')return;if(d.type==='invoice'&&totals(d).paid>0){alert('This invoice has recorded payments. Use a documented credit note and refund process in your accounting system instead of voiding it here.');return}if(!confirm('Void this issued document? It remains in the ledger and cannot be edited.'))return;const original=getDoc(d.id);if(!original){alert('Save this document first.');return}original.status='void';original.updatedAt=new Date().toISOString();events(original,'Document voided');save();state.draft=structuredClone(original);render();notify('Document voided and retained in history.')}
function hasUnsavedDraft(){if(!state.draft||state.draft.status!=='draft')return false;const original=getDoc(state.draft.id);return !original||JSON.stringify(state.draft)!==JSON.stringify(original)}
function allowDiscard(){if(pricingDirty()&&!confirm('Leave without saving the price changes?'))return false;state.pricingDraft=null;return !hasUnsavedDraft()||confirm('Discard unsaved draft changes? Save your draft first to keep them.')}
function deleteDraft(){const d=state.draft;if(!d||d.status!=='draft')return;if(!confirm('Delete this draft? This cannot be undone.'))return;data.documents=data.documents.filter(x=>x.id!==d.id);save();state.draft=null;render();notify('Draft removed.')}


function renderProducts(){const q=state.prodSearch.toLowerCase().trim();const list=products().filter(p=>[p.sku,p.name,p.spec,p.defaultLot].join(' ').toLowerCase().includes(q));return head('Product catalog',`${data.products.length} products, including the Sep 2026 supplier cost list. Quotes and invoices select the wholesale or retail price automatically.`,btn('add-product','＋ Add SKU','primary')+btn('import-open','↑ Import catalog')+btn('nav','Prices & margins · adjust margins','', 'data-tab="pricing"'))+`<div class="notice">Supplier cost is for <strong>10 vials</strong> on every imported line. Prices below are per vial. ${h('UNASSIGNED-063')} is an internal placeholder for Lemon Bottle because the PDF did not list a readable code.</div><div class="card"><div class="tools"><input id="prodSearch" placeholder="Search SKU, name, specification..." value="${h(state.prodSearch)}"></div><div id="prodList">${productTable(list)}</div></div>`}

function priceLever(key,title,description,min,max,step){const v=priceSettings()[key];return `<div class="lever"><h3>${title}</h3><p>${description}</p><div class="paired"><input data-price="${key}" type="range" min="${min}" max="${max}" step="${step}" value="${h(v)}" aria-label="${title} slider"><input data-price="${key}" type="number" min="${min}" max="${max}" step="${step}" value="${h(v)}" required aria-label="${title} numeric input"></div></div>`}
function priceSelect(key,title,desc,values){return `<div class="lever"><h3>${title}</h3><p>${desc}</p><select data-price="${key}" aria-label="${title}">${values.map(([v,label])=>`<option value="${h(v)}" ${String(priceSettings()[key])===String(v)?'selected':''}>${h(label)}</option>`).join('')}</select></div>`}

function renderPricingStats(){const settings=priceSettings();const rows=data.products.filter(p=>unitLandedCost(p,'THB',settings)>0),wh=rows.map(p=>pricingForProduct(p,'wholesale','THB',settings)),rt=rows.map(p=>pricingForProduct(p,'retail','THB',settings));const avg=a=>a.length?amount(a.reduce((s,v)=>s+(v.grossMargin||0),0)/a.length):0;
return `<div class="price-metrics"><div><small>Products with costs</small><strong>${rows.length}</strong><small>Source dated 29 Sep 2026</small></div><div><small>Average wholesale gross margin</small><strong>${avg(wh)}%</strong><small>After rounding, before discounts/tax</small></div><div><small>Average retail gross margin</small><strong>${avg(rt)}%</strong><small>After rounding, before discounts/tax</small></div></div>`}

function saveCustomer(){const form=document.getElementById('customerForm');if(!form.reportValidity())return;const x=Object.fromEntries(new FormData(form));x.name=x.name.trim();x.terms=nval(x.terms);x.owner=String(x.owner||'').toLowerCase();x.stage=STAGES.some(s=>s[0]===x.stage)?x.stage:'active';if(!x.name)return;const original=x.id?getCustomer(x.id):null;if(original)Object.assign(original,x);else{x.id=uid();x.activities=[];x.createdAt=new Date().toISOString();x.createdBy=me.email;data.customers.push(x)}save();modalClose();render();notify('Customer saved.');if(state.draft&&state.draft.status==='draft'&&!state.draft.customerId){setCustomer(x.id)}}
function saveProduct(){const form=document.getElementById('productForm');if(!form.reportValidity())return;const x=Object.fromEntries(new FormData(form));x.sku=x.sku.trim();x.name=x.name.trim();x.priceTHB=amount(x.priceTHB);x.priceUSD=amount(x.priceUSD);x.costUSDPack=amount(x.costUSDPack);x.costTHBPack=amount(x.costTHBPack);x.packCount=Math.max(1,Math.floor(nval(x.packCount)||10));for(const k of ['wholesaleMarkupOverride','retailMarkupOverride','moqOverride','wholesaleTHBOverride','retailTHBOverride','wholesaleUSDOverride','retailUSDOverride'])if(x[k]!==''&&x[k]!==undefined)x[k]=nval(x[k]);if(data.products.some(p=>p.sku.toLowerCase()===x.sku.toLowerCase()&&p.id!==x.id)){alert('SKU is already in the catalog.');return}const original=x.id?getProduct(x.id):null;if(original)Object.assign(original,x);else{x.id=uid();data.products.push(x)}save();modalClose();render();notify('Catalog item saved.')}
function savePayment(print=false){const f=document.getElementById('paymentForm');if(!f.reportValidity())return;const vals=Object.fromEntries(new FormData(f));const amt=amount(vals.amount),d=state.draft,remaining=totals(d).due;if(amt<=0||amt>remaining+.009){alert('Amount must be positive and no more than the unpaid balance.');return}const original=getDoc(d.id);if(!original){alert('Invoice not found.');return}const payment={id:uid(),receiptNumber:nextNumber('receipt',vals.date),date:vals.date,amount:amt,method:vals.method,reference:vals.reference,by:me.email,createdAt:new Date().toISOString()};original.payments.push(payment);original.updatedAt=new Date().toISOString();events(original,`Payment recorded: ${fmt(amt,original.currency)}`);save();state.draft=structuredClone(original);modalClose();render();notify('Payment recorded · receipt '+payment.receiptNumber);if(print)printReceipt(original,payment.id)}
function saveSettings(){const f=document.getElementById('settingsForm');if(!f.reportValidity())return;const v=Object.fromEntries(new FormData(f));v.vatRegistered=f.elements.vatRegistered.checked;v.defaultTerms=Math.max(0,Math.min(365,nval(v.defaultTerms)));v.vatRate=Math.max(0,Math.min(30,nval(v.vatRate)));for(const key of ['invoicePrefix','quotePrefix','proformaPrefix','receiptPrefix'])v[key]=(v[key]||'DOC').trim().toUpperCase().replace(/[^A-Z0-9-]/g,'').slice(0,10)||'DOC';data.settings={...data.settings,...v};save();render();notify('Business settings saved.')}
function download(filename,text,mime){const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function toCSV(rows){return rows.map(row=>row.map(v=>{const raw=String(v??'');const guarded=typeof v==='string'&&/^[\s]*[=+@-]/.test(raw)?"'"+raw:raw;return '"'+guarded.replaceAll('"','""')+'"'}).join(',')).join('\r\n')}
function exportCSV(){const cols=['Document number','Type','Status','Customer','Buyer tax ID','Issue date','Due date','Currency','Subtotal','VAT','Total','Paid','Balance','PO','Reference','SKUs','Lots','Shipping method','Shipping','Delivery','Tracking','Receipts'];const rows=data.documents.map(d=>{const t=totals(d);return[d.number||'DRAFT',d.type,status(d),d.customerName,d.customerTaxId,d.issueDate,d.dueDate,d.currency,t.subtotal,t.vat,t.total,t.paid,t.due,d.po,d.reference,d.items.map(i=>i.sku).join(' | '),d.items.map(i=>i.lot).join(' | '),d.shippingMethod||'',t.shipping,d.delivery?.status?deliveryName(d.delivery.status):'',d.delivery?.tracking||'',(d.payments||[]).map(p=>p.receiptNumber||'').filter(Boolean).join(' | ')]});download(`wholesale-documents-${today()}.csv`,'\ufeff'+toCSV([cols,...rows]),'text/csv;charset=utf-8');notify('Document CSV downloaded.')}
function mergeCatalog(current,obj){if(!obj||obj.version!==1||!Array.isArray(obj.products)||!obj.products.length)throw Error('Choose a Wholesale Desk catalog JSON file.');const existing=new Set(current.products.map(p=>p.sku.trim().toLowerCase())),ids=new Set(current.products.map(p=>p.id));let added=0,skipped=0;const next=structuredClone(current);for(const source of obj.products){if(!source||typeof source.sku!=='string'||!source.sku.trim()||typeof source.name!=='string'||!source.name.trim())throw Error('A catalog item is missing its SKU or name.');if(existing.has(source.sku.trim().toLowerCase())){skipped++;continue;}if(!Number.isFinite(Number(source.packCount))||Number(source.packCount)<1||!Number.isInteger(Number(source.packCount)))throw Error('Invalid pack quantity for '+source.sku);for(const k of ['costUSDPack','costTHBPack'])if(!Number.isFinite(Number(source[k]))||Number(source[k])<0)throw Error('Invalid supplier cost for '+source.sku);const p=structuredClone(source);p.sku=p.sku.trim();if(typeof p.id!=='string'||!p.id||ids.has(p.id))p.id=uid();ids.add(p.id);existing.add(p.sku.toLowerCase());next.products.push(p);added++;}if(next.products.length>5000)throw Error('Catalog exceeds 5,000 products.');next.sourceListVersion=obj.sourceListVersion||next.sourceListVersion;return {next,added,skipped}}

function applyCatalog(obj){if(!cloudReady||syncLocked)throw Error('Cloud connection unavailable. Reload before importing.');const {next,added,skipped}=mergeCatalog(data,obj);if(!added){notify('No new SKUs · '+skipped+' already in your catalog.');return;}data=next;save();modalClose();state.tab='pricing';state.pricingDraft=null;render();notify('Added '+added+' products · '+skipped+' existing SKUs kept. Saving…');}
function importCatalog(file){const reader=new FileReader();reader.onload=()=>{try{applyCatalog(JSON.parse(reader.result))}catch(e){alert('Catalog not imported: '+e.message)}};reader.readAsText(file)}
function importBackup(file){const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);if(!obj||obj.version!==1||!Array.isArray(obj.documents)||!Array.isArray(obj.customers)||!Array.isArray(obj.products)||!obj.settings)throw new Error('Not a Wholesale Desk backup');if(!confirm(`Replace ALL current records with this backup?\n\n${obj.documents.length} documents, ${obj.customers.length} customers and ${obj.products.length} products. Export your existing data first if needed.`))return;data=Object.assign(initial(),obj);seedSupplierCatalog();save();state.draft=null;state.tab='dashboard';render();notify('Backup restored.')}catch(e){alert('Could not import backup: '+e.message)}};r.readAsText(file)}

function printDoc(doc){if(!doc)return;const s=data.settings,t=totals(doc);const heading=doc.type==='invoice'?'COMMERCIAL INVOICE / ใบแจ้งหนี้':doc.type==='quote'?'QUOTATION / ใบเสนอราคา':'PROFORMA INVOICE';const lines=doc.items.map((it,i)=>`<tr><td>${i+1}</td><td><strong>${h(it.description)}</strong><br><span class="print-small">SKU: ${h(it.sku||'—')}${it.lot?' · Lot: '+h(it.lot):''}${it.expiry?' · Exp: '+h(it.expiry):''}${it.coa?' · CoA: '+(safeLink(it.coa)||h(it.coa)):''}</span></td><td>${h(it.qty)} ${h(it.unit)}</td><td style="text-align:right">${fmt(it.unitPrice,doc.currency)}</td><td style="text-align:right">${nval(it.discount)}%</td><td style="text-align:right">${fmt(lineTotal(it),doc.currency)}</td></tr>`).join('');

function teamList(){const seen=new Set(),list=[];for(const t of [...team,...(me.email?[{email:me.email,name:me.name}]:[])]){const email=String(t.email||'').toLowerCase();if(!email||seen.has(email))continue;seen.add(email);list.push({email,name:String(t.name||email.split('@')[0])})}return list}
function personName(email){const e=String(email||'').toLowerCase();if(!e)return '';return teamList().find(x=>x.email===e)?.name||e.split('@')[0]}

function shipCurrency(doc){return doc.currency==='USD'?'USD':'THB'}
function itemsSubtotal(doc){return amount((doc.items||[]).reduce((s,r)=>s+lineTotal(r),0))}
function freeOver(opt,doc){const v=opt?.['freeOver'+shipCurrency(doc)];return v!==''&&v!=null&&nval(v)>0?nval(v):0}
function shippingQuote(opt,doc){if(!opt)return 0;const free=freeOver(opt,doc);if(free&&itemsSubtotal(doc)>=free)return 0;return amount(Math.max(0,nval(opt['price'+shipCurrency(doc)])))}
function applyShipping(doc){const opt=shippingOptions().find(o=>o.id===doc.shippingOptionId);if(!opt)return;doc.shippingMethod=opt.name;doc.shippingZone=opt.zone;doc.shippingCarrier=opt.carrier||'';doc.shippingDays=opt.days||'';if(!doc.shippingManual)doc.shippingAmount=shippingQuote(opt,doc)}
function shipHint(d){const opt=shippingOptions().find(o=>o.id===d.shippingOptionId);if(!opt)return d.shippingOptionId==='custom'?'Custom charge for this document only.':'Choose a method to add a shipping charge. The ship-to address is in Document details.';const bits=[zoneName[opt.zone]||'',opt.carrier,opt.days].filter(Boolean);const free=freeOver(opt,d);if(free)bits.push(itemsSubtotal(d)>=free?`free over ${fmt(free,d.currency)} · this order qualifies`:`free over ${fmt(free,d.currency)}`);if(d.shippingManual)bits.push('charge changed by hand');return bits.join(' · ')}
function renderShipping(d){const issued=readonly(),dis=issued?'disabled':'';const cur=shipCurrency(d);const group=z=>shippingOptions().filter(o=>o.zone===z).map(o=>`<option value="${h(o.id)}" ${o.id===d.shippingOptionId?'selected':''}>${h(o.name)} · ${fmt(o['price'+cur],cur)}</option>`).join('');const custom=d.shippingOptionId==='custom';

function refreshShipping(){const d=state.draft;if(!d||readonly())return;applyShipping(d);const a=document.querySelector('[data-ship="amount"]');if(a&&document.activeElement!==a)a.value=String(amount(d.shippingAmount));const hint=document.getElementById('shipHint');if(hint)hint.textContent=shipHint(d)}
function shipChange(t){const d=state.draft;if(t.dataset.ship!=='option')return;const v=t.value;if(!v)Object.assign(d,{shippingOptionId:'',shippingMethod:'',shippingZone:'',shippingCarrier:'',shippingDays:'',shippingAmount:0,shippingManual:false});else if(v==='custom')Object.assign(d,{shippingOptionId:'custom',shippingMethod:d.shippingOptionId==='custom'?d.shippingMethod:'',shippingZone:'',shippingCarrier:'',shippingDays:'',shippingManual:true});else{d.shippingOptionId=v;d.shippingManual=false;applyShipping(d)}const card=document.getElementById('shippingCard');if(card)card.outerHTML=renderShipping(d);refreshTotals()}

function allReceipts(){return data.documents.filter(d=>d.type==='invoice'&&d.status!=='draft').flatMap(d=>(d.payments||[]).map((p,i)=>({d,p,i}))).sort((a,b)=>String(b.p.date||'').localeCompare(String(a.p.date||''))||String(b.p.createdAt||'').localeCompare(String(a.p.createdAt||'')))}

function receiptsTable(){const q=state.receiptSearch.toLowerCase().trim(),all=allReceipts();const list=all.filter(({d,p,i})=>!q||[receiptNo(d,p,i),d.number,d.customerName,p.method,p.reference].join(' ').toLowerCase().includes(q));if(!list.length)return `<div class="empty"><div class="symbol">✓</div><strong>${all.length?'No matching receipts':'No receipts yet'}</strong><p>${all.length?'Try another search.':'Record a payment on an issued invoice. Each payment gets its own receipt number.'}</p></div>`;

function customerDocs(c){return data.documents.filter(d=>d.customerId===c.id)}
function customerMoney(c){const out={};for(const d of customerDocs(c)){if(d.type!=='invoice'||d.status!=='issued')continue;const t=totals(d),m=out[d.currency]||(out[d.currency]={billed:0,paid:0,due:0});m.billed+=t.total;m.paid+=t.paid;m.due+=Math.max(0,t.due)}return out}
function moneyLine(m,key){const parts=Object.entries(m).filter(([,v])=>v[key]>.009).map(([c,v])=>fmt(v[key],c));return parts.length?parts.join(' · '):'—'}
function lastOrder(c){return customerDocs(c).filter(d=>d.type==='invoice'&&d.status==='issued').map(d=>d.issueDate).sort().pop()||''}
function followClass(date){return !date?'':date<today()?'overdue':date===today()?'partial':''}
function customerMatches(c){const q=state.custSearch.toLowerCase().trim();if(q&&![c.name,c.contact,c.email,c.phone,c.lineId,c.taxId,c.address,c.tags,c.source,c.country].join(' ').toLowerCase().includes(q))return false;if(state.custStage!=='all'&&stageOf(c)!==state.custStage)return false;const o=state.custOwner;if(o==='mine')return !!c.owner&&personName(c.owner)===personName(me.email);if(o==='none')return !c.owner;if(o!=='all')return personName(c.owner)===o;return true}
function stageCounts(){const n={lead:0,prospect:0,active:0,inactive:0};for(const c of data.customers)n[stageOf(c)]++;return n}
function renderCustomers(){const n=stageCounts(),owners=ownerChoices();return head('Customers','Buyers and leads: contacts, follow-ups, notes, orders and balances.',btn('add-customer','＋ Add customer','primary')+btn('add-lead','＋ Add lead'))+`<div class="card"><div class="stage-row">${[['all','All',data.customers.length],...STAGES.map(([k,l])=>[k,l,n[k]])].map(([k,l,c])=>`<button type="button" class="btn small ${state.custStage===k?'dark':''}" data-act="cust-stage" data-stage="${k}">${h(l)} <span class="chip">${c}</span></button>`).join('')}</div><div class="tools"><input id="custSearch" placeholder="Find name, contact, phone, LINE, tag…" value="${h(state.custSearch)}" aria-label="Search customers"><select id="custOwner" aria-label="Owner"><option value="all">All owners</option><option value="mine" ${state.custOwner==='mine'?'selected':''}>Mine</option>${owners.map(o=>`<option value="${h(o.name)}" ${state.custOwner===o.name?'selected':''}>${h(o.name)}</option>`).join('')}<option value="none" ${state.custOwner==='none'?'selected':''}>No owner</option></select></div><div id="custList">${customerTiles(customers().filter(customerMatches))}</div></div>`}

function timeline(c){const rows=(Array.isArray(c.activities)?c.activities:[]).map(a=>({...a,stored:true}));for(const d of customerDocs(c)){if(d.status==='draft')continue;rows.push({date:d.issueDate,at:d.createdAt,kind:typename[d.type],text:`${d.number} · ${fmt(totals(d).total,d.currency)}${d.status==='void'?' · voided':''}`,docId:d.id});(d.payments||[]).forEach((p,i)=>rows.push({date:p.date,at:p.createdAt,kind:'Payment',text:`${receiptNo(d,p,i)} · ${fmt(p.amount,d.currency)}`,docId:d.id,by:p.by}));if(d.delivery?.shippedOn)rows.push({date:d.delivery.shippedOn,at:d.delivery.updatedAt,kind:'Shipped',text:`${d.number}${d.delivery.tracking?' · '+d.delivery.tracking:''}`,docId:d.id,by:d.delivery.updatedBy})}return rows.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||String(b.at||'').localeCompare(String(a.at||'')))}
function fact(label,value,raw=false){if(value===undefined||value===null||String(value).trim()==='')return '';return `<dt>${h(label)}</dt><dd>${raw?value:h(value).replaceAll('\n','<br>')}</dd>`}

`<div class="stats"><div class="stat featured"><div class="hint">Invoiced</div><strong class="stat-small">${moneyLine(m,'billed')}</strong><small>Issued invoices</small></div><div class="stat"><div class="hint">Paid</div><strong class="stat-small">${moneyLine(m,'paid')}</strong><small>Receipts</small></div><div class="stat"><div class="hint">Owes</div><strong class="stat-small">${moneyLine(m,'due')}</strong><small>Open balance</small></div><div class="stat"><div class="hint">Last order</div><strong class="stat-small">${labelDate(lastOrder(c))}</strong><small>${docs.filter(d=>d.type==='invoice'&&d.status==='issued').length} invoice(s)</small></div></div>

<div><div class="card"><h2>Next follow-up</h2><form id="followForm"><div class="grid-2">${field('Date',`<input type="date" name="nextFollowUp" value="${h(c.nextFollowUp||'')}">`)}${field('Owner',ownerSelect(c.owner))}</div><div class="field" style="margin-top:10px"><label>What to do</label><input name="followUpNote" value="${h(c.followUpNote||'')}" placeholder="Send restock quote"></div><div class="mini-actions" style="margin-top:10px">${btn('save-followup','Save','primary small',idx)}${c.nextFollowUp?btn('followup-done','Done ✓','small',idx):''}</div></form></div>

function saveFollowup(id){const c=getCustomer(id),f=document.getElementById('followForm');if(!c||!f||!f.reportValidity())return;const v=Object.fromEntries(new FormData(f));c.nextFollowUp=v.nextFollowUp||'';c.followUpNote=String(v.followUpNote||'').trim();c.owner=String(v.owner||'').toLowerCase();save();render();notify(c.nextFollowUp?'Follow-up set for '+labelDate(c.nextFollowUp)+'.':'Follow-up cleared.')}
function followupDone(id){const c=getCustomer(id);if(!c)return;c.activities=Array.isArray(c.activities)?c.activities:[];c.activities.push({id:uid(),date:today(),kind:'Note',text:'Follow-up done'+(c.followUpNote?': '+c.followUpNote:''),by:me.email,at:new Date().toISOString()});c.nextFollowUp='';c.followUpNote='';save();render();notify('Follow-up done.')}

function renderToday(){const soon=plusDays(today(),7);const due=data.customers.filter(c=>c.nextFollowUp&&c.nextFollowUp<=soon).sort((a,b)=>a.nextFollowUp.localeCompare(b.nextFollowUp));const ship=data.documents.filter(d=>d.status==='issued'&&d.type!=='quote'&&(d.shippingMethod||d.delivery)&&!['shipped','delivered','returned'].includes(d.delivery?.status));
return `<div class="card"><div class="section-head"><h2>Follow-ups · next 7 days</h2><button class="linkbtn" data-act="nav" data-tab="customers">Customers →</button></div>${due.length?`<div class="stack">${due.slice(0,8).map(c=>`<div class="keyline"><div><button class="linkbtn tile-name" data-act="open-customer" data-id="${h(c.id)}">${h(c.name)}</button><div class="footnote">${h(c.followUpNote||'Follow up')}${c.owner?' · '+h(personName(c.owner)):''}</div></div><span class="followup ${followClass(c.nextFollowUp)}">${labelDate(c.nextFollowUp)}</span></div>`).join('')}</div>`:'<p class="footnote">None due. Set a follow-up date on a customer page.</p>'}<div class="divider"></div><div class="section-head"><h2>To ship</h2></div>${ship.length?`<div class="stack">${ship.slice(0,8).map(d=>`<div class="keyline"><div><button class="linkbtn tile-name" data-act="open-doc" data-id="${h(d.id)}">${h(d.number)}</button><div class="footnote">${h(d.customerName||'')}${d.shippingMethod?' · '+h(d.shippingMethod):''}</div></div><span class="pill partial">${h(deliveryName(d.delivery?.status||'to-ship'))}</span></div>`).join('')}</div>`:'<p class="footnote">Nothing waiting to ship.</p>'}</div>`}
function setupNeeded(){return !String(data.settings.sellerName||'').trim()||!String(data.settings.sellerAddress||'').trim()||!data.customers.length||!data.products.length}
function renderShippingSettings(){const opts=shippingOptions();const row=o=>`<tr><td><button class="linkbtn tile-name" data-act="edit-ship-option" data-id="${h(o.id)}">${h(o.name)}</button><small>${h([o.carrier,o.days].filter(Boolean).join(' · '))}</small></td><td class="right">${fmt(o.priceTHB,'THB')}</td><td class="right">${fmt(o.priceUSD,'USD')}</td><td>${nval(o.freeOverTHB)>0?'Free over '+fmt(o.freeOverTHB,'THB'):''}${nval(o.freeOverUSD)>0?`<small>Free over ${fmt(o.freeOverUSD,'USD')}</small>`:''}</td><td><div class="mini-actions"><button class="linkbtn" data-act="edit-ship-option" data-id="${h(o.id)}">Edit</button><button class="linkbtn remove-link" data-act="delete-ship-option" data-id="${h(o.id)}">Remove</button></div></td></tr>`;

function shipOptionModal(id){const o=shippingOptions().find(x=>x.id===id)||{id:'',name:'',zone:'domestic',carrier:'',days:'',priceTHB:0,priceUSD:0,freeOverTHB:'',freeOverUSD:''};modalOpen(id?'Edit shipping option':'New shipping option',`<form id="shipOptForm"><input type="hidden" name="id" value="${h(o.id)}"><div class="grid-2">${field('Name on invoice',`<input name="name" required maxlength="60" value="${h(o.name)}" placeholder="International express">`)}${field('Zone',`<select name="zone"><option value="domestic" ${o.zone!=='international'?'selected':''}>Domestic · Thailand</option><option value="international" ${o.zone==='international'?'selected':''}>International</option></select>`)}${field('Carrier',`<input name="carrier" value="${h(o.carrier)}" placeholder="Kerry, Flash, EMS, DHL…">`)}${field('Delivery time',`<input name="days" value="${h(o.days)}" placeholder="2–4 days">`)}${field('Charge · THB',`<input name="priceTHB" type="number" min="0" step="0.01" required value="${h(o.priceTHB)}">`)}${field('Charge · USD',`<input name="priceUSD" type="number" min="0" step="0.01" required value="${h(o.priceUSD)}">`)}${field('Free over · THB order',`<input name="freeOverTHB" type="number" min="0" step="0.01" value="${h(o.freeOverTHB??'')}" placeholder="Blank: always charge">`)}${field('Free over · USD order',`<input name="freeOverUSD" type="number" min="0" step="0.01" value="${h(o.freeOverUSD??'')}" placeholder="Blank: always charge">`)}</div><p class="footnote">Issued documents stay at the charge they were issued with.</p><div class="modal-foot">${btn('close-modal','Cancel')}${btn('save-ship-option','Save option','primary')}</div></form>`)}
function refreshShippingSettings(){const el=document.getElementById('shippingSettings');if(el)el.outerHTML=renderShippingSettings();else render()}
function saveShipOption(){const f=document.getElementById('shipOptForm');if(!f.reportValidity())return;const v=Object.fromEntries(new FormData(f));const o={id:v.id||'ship-'+uid().replace(/[^a-z0-9]/gi,'').slice(0,10),name:String(v.name).trim(),zone:v.zone==='international'?'international':'domestic',carrier:String(v.carrier||'').trim(),days:String(v.days||'').trim(),priceTHB:amount(Math.max(0,nval(v.priceTHB))),priceUSD:amount(Math.max(0,nval(v.priceUSD))),freeOverTHB:v.freeOverTHB===''?'':amount(Math.max(0,nval(v.freeOverTHB))),freeOverUSD:v.freeOverUSD===''?'':amount(Math.max(0,nval(v.freeOverUSD)))};if(!o.name)return;const list=shippingOptions().slice(),i=list.findIndex(x=>x.id===o.id);if(i>=0)list[i]=o;else list.push(o);data.settings.shippingOptions=list;save();modalClose();refreshShippingSettings();notify('Shipping option saved.')}
function deleteShipOption(id){if(!confirm('Remove this shipping option? Documents already using it are unchanged.'))return;data.settings.shippingOptions=shippingOptions().filter(o=>o.id!==id);save();refreshShippingSettings();notify('Shipping option removed.')}
function renderTeamCard(){const list=teamList();return `<div class="card"><h2>Team</h2><p class="muted smalltext">Signed in as <strong>${h(personName(me.email)||'—')}</strong>${me.email?' · '+h(me.email):''}. Each address below signs in on any phone, tablet or computer: open this page, enter the address, then type the code Cloudflare emails to it.</p>${list.length?`<div class="stack">${list.map(t=>`<div class="keyline"><strong>${h(t.name)}</strong><span class="muted smalltext">${h(t.email)}</span></div>`).join('')}</div>`:''}<div class="divider"></div><div class="mini-actions"><a class="btn small" href="/cdn-cgi/access/logout">Sign out on this device</a>${btn('install-app','＋ Install on this device','small')}</div></div>`}

if(t.id==='importFile'&&t.files[0]){importBackup(t.files[0]);t.value=''}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.ship&&state.draft&&!readonly()){shipInput(t);return}if(t.id==='receiptSearch'){state.receiptSearch=t.value;const el=document.getElementById('receiptWrap');if(el)el.innerHTML=receiptsTable();return}if(t.dataset.margin){if(!t.checkValidity())return;priceSettings()[t.dataset.margin+'Markup']=marginToMarkup(Number(t.value));refreshPricingLab();return;}if(t.dataset.price&&t.tagName==='INPUT'){if(!t.checkValidity()||t.value==='')return;const key=t.dataset.price;const val=nval(t.value);priceSettings()[key]=val;document.querySelectorAll('[data-price="'+key+'"]').forEach(x=>{if(x!==t)x.value=String(val)});refreshPricingLab();return;}if(t.id==='pricingSearch'){state.pricingSearch=t.value;state.pricingPage=0;refreshPricingLab();return;}if(t.dataset.doc&&state.draft&&!readonly()){state.draft[t.dataset.doc]=t.type==='checkbox'?t.checked:t.value;refreshTotals()}
if(t.dataset.item&&state.draft&&!readonly()){const i=nval(t.closest('[data-line]')?.dataset.line);if(state.draft.items[i])state.draft.items[i][t.dataset.item]=t.value;refreshTotals()}
if(t.id==='docSearch'){state.search=t.value;const el=document.getElementById('docTableWrap');if(el)el.innerHTML=docsTable()}
if(t.id==='custSearch'){state.custSearch=t.value;const el=document.getElementById('custList');if(el)el.innerHTML=customerTiles(customers().filter(customerMatches))}
if(t.id==='prodSearch'){state.prodSearch=t.value;const el=document.getElementById('prodList');if(el)el.innerHTML=productTable(products().filter(p=>[p.sku,p.name,p.spec,p.defaultLot].join(' ').toLowerCase().includes(state.prodSearch.toLowerCase().trim())))}
});
document.addEventListener('submit',e=>{if(['customerForm','productForm','paymentForm','settingsForm','pricingForm','marginForm','deliveryForm','shipOptForm','activityForm','followForm'].includes(e.target.id))e.preventDefault()});
window.addEventListener('beforeunload',e=>{if(pricingDirty()||hasUnsavedDraft()||saveInFlight||dirtySnapshot||syncLocked){e.preventDefault();e.returnValue=''}});
connectCloud();
})();
</script>
<script>
let installEvent=null;
window.addEventListener('beforeinstallprompt', e=>{e.preventDefault();installEvent=e;});
document.addEventListener('click',async e=>{
 if(!e.target.closest('[data-act="install-app"]'))return;
 if(installEvent){const p=installEvent;installEvent=null;await p.prompt();}
 else alert('Install: on iPhone use Safari → Share → Add to Home Screen. On Android/Chrome use the menu → Install app. On desktop use the browser Install icon.');
});

</script>
