<script>
(()=>{'use strict';
const STORAGE_KEY='nanobotco-wholesale-desk-web-v1';
const SUPPLIER_LIST_DATE='2026-09-29';
const RAW_SUPPLIER_SKUS=[]; // Confidential supplier catalog excluded from public code.
const escapeHTML=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const h=escapeHTML;
const uid=()=>((globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():('w'+Date.now()+Math.random().toString(36).slice(2)));
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const plusDays=(date,n)=>{const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const amount=(n)=>Math.round((Number(n)||0)*100)/100;
const nval=(v)=>Number.isFinite(+v)?+v:0;
const fmt=(n,c='THB')=>`${c} ${amount(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const labelDate=(d)=>d?new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';
const safeLink=(s)=>{try{const x=new URL(s);return x.protocol==='https:'||x.protocol==='http:'?escapeHTML(x.href):''}catch{return ''}};
function defaultPricing(){return {wholesaleMarkup:40,retailMarkup:100,wholesaleMOQ:10,testingUSDPerPack:0,freightUSDPerPack:0,handlingUSDPerPack:0,fxTHBPerUSD:33.53,thbCostBasis:'source',roundTHBWholesale:50,roundTHBRetail:50,roundUSDWholesale:1,roundUSDRetail:1}}
function initial(){return {version:1,pricing:defaultPricing(),sourceListVersion:'',settings:{sellerName:'',sellerAddress:'',sellerTaxId:'',sellerEmail:'',sellerPhone:'',bankDetails:'',defaultCurrency:'THB',defaultTerms:14,vatRegistered:false,vatRate:7,invoicePrefix:'INV',quotePrefix:'QT',proformaPrefix:'PI',notes:'Thank you for your business.'},customers:[],products:[],documents:[],sequences:{}}}
let data=initial();let storageOk=false;
let serverRevision=null, cloudReady=false, syncLocked=false, saveInFlight=false, dirtySnapshot=null, syncingTimer=null;
function syncLabel(){const el=document.getElementById('syncLabel');if(!el)return;el.textContent=syncLocked?'⛔ NOT SAVED — backup & reload':!cloudReady?'Connecting…':(dirtySnapshot||saveInFlight)?'↻ Saving to D1…':'✓ D1 saved · revision '+serverRevision; el.style.color=syncLocked?'#ffad9f':(dirtySnapshot||saveInFlight)?'#ffe2a5':'#bce6d5';}
async function cloudJSON(path,opts={}){const res=await fetch(path,{cache:'no-store',credentials:'same-origin',...opts});let body;try{body=await res.json()}catch{throw Error('Unexpected server response. Check Cloudflare Access sign-in.')}if(!res.ok)throw Error(body.error||'Server error');return body;}
async function connectCloud(){try{await cloudJSON('/api/session');const x=await cloudJSON('/api/workspace');serverRevision=x.revision;data=Object.assign(initial(),x.state||{});cloudReady=true;storageOk=true;syncLabel();render();if(!data.products.length)notify('Cloud workspace ready · import private supplier catalog JSON.');}catch(e){syncLocked=true;syncLabel();document.getElementById('view').innerHTML='<div class="card"><h2>Cloud workspace unavailable</h2><div class="notice error">'+escapeHTML(e.message)+'</div><p>Verify Access policy, Worker variables, and D1 binding. No data has been saved.</p><button class="btn primary" onclick="location.reload()">Retry</button></div>';}}
async function persistSnapshot(){if(saveInFlight||syncLocked||!cloudReady||!dirtySnapshot)return;saveInFlight=true;syncLabel();try{while(dirtySnapshot&&!syncLocked){const snapshot=dirtySnapshot;dirtySnapshot=null;const x=await cloudJSON('/api/workspace',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision:serverRevision,state:snapshot})});serverRevision=x.revision;}}catch(e){syncLocked=true;notify('Cloud save blocked · export backup.');alert('Recent edits were NOT saved to Cloudflare.\n'+e.message+'\nDownload Backup before reloading to reconcile.');}finally{saveInFlight=false;syncLabel();}}
// Import 157 line items without destroying existing user edits or saved invoices.
// An entry with no source supplier code is given a clearly flagged INTERNAL placeholder.
function seedSupplierCatalog(){const existing=new Set(data.products.map(p=>String(p.sku).toLowerCase()));let added=0;
for(const x of RAW_SUPPLIER_SKUS){const [row,sku,name,spec,costUSD,costTHB,needsSKU]=x;if(existing.has(String(sku).toLowerCase()))continue;
 data.products.push({id:'supplier-'+row,sku,name,spec,unit:'vial',packCount:10,costUSDPack:costUSD,costTHBPack:costTHB,priceTHB:0,priceUSD:0,wholesaleMarkupOverride:'',retailMarkupOverride:'',moqOverride:'',wholesaleTHBOverride:'',retailTHBOverride:'',wholesaleUSDOverride:'',retailUSDOverride:'',sourceNote:needsSKU?'Supplier PDF has no SKU at row 63. Replace this internal placeholder after confirmation.':'Supplier price list 29 Sep 2026',sourceRow:row,defaultLot:'',expiry:'',coa:''});existing.add(String(sku).toLowerCase());added++;}
 data.pricing={...defaultPricing(),...(data.pricing||{})};data.sourceListVersion=SUPPLIER_LIST_DATE; if(added)save();return added}
// Private catalog is imported through the protected workspace, never bundled in public source.
const state={tab:'dashboard',draft:null,search:'',filter:'all',custSearch:'',prodSearch:'',pricingSearch:'',pricingPage:0};
let toastTimeout;
function markupToMargin(markup){return 100*nval(markup)/(100+nval(markup))}
function marginToMarkup(margin){if(!Number.isFinite(margin)||margin<0||margin>95)throw Error('Margin must be between 0% and 95%.');return 100*margin/(100-margin)}
function shownMargin(markup){return Math.round(markupToMargin(markup)*10000)/10000}
function priceSettings(){return state.pricingDraft||data.pricing}
function pricingDirty(){return !!state.pricingDraft&&JSON.stringify(state.pricingDraft)!==JSON.stringify(data.pricing)}
function marginCard(channel,title){const margin=shownMargin(priceSettings()[channel+'Markup']);return `<section class="margin-card"><h3>${title}</h3><p>Profit kept from each sale, after product costs.</p><label for="${channel}Margin">Target gross margin</label><div class="margin-entry"><input id="${channel}Margin" data-margin="${channel}" type="number" min="0" max="95" step="any" value="${margin}" required aria-describedby="${channel}Example"><span>%</span></div><div class="margin-presets">${[20,30,40,50,60].map(n=>`<button type="button" class="btn small" data-act="margin-preset" data-channel="${channel}" data-value="${n}">${n}%</button>`).join('')}</div><p id="${channel}Example" class="margin-example">For every ฿100 sold, keep ฿${amount(margin)} before other expenses and tax. Rounding may increase this.</p></section>`}
function refreshMarginExamples(){for(const channel of ['wholesale','retail']){const el=document.getElementById(channel+'Example');if(el){const m=markupToMargin(priceSettings()[channel+'Markup']);el.textContent=`For every ฿100 sold, keep ฿${amount(m)} before other expenses and tax. Rounding may increase this.`}}}
function refreshPricingSave(){const b=document.querySelector('[data-act="apply-pricing"]');if(b)b.disabled=!pricingDirty();const el=document.getElementById('pricingSaveStatus');if(el)el.textContent=pricingDirty()?'Preview only · click Save prices to apply.':'Saved settings · changes appear in new invoice lines.'}
function applyPricing(){const f=document.getElementById('pricingForm');if(!f.reportValidity())return;data.pricing={...priceSettings()};state.pricingDraft={...data.pricing};save();refreshPricingSave();notify('Saving prices for everyone…');}

function notify(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove('show'),3100)}
function save(){if(!cloudReady||syncLocked){syncLabel();notify('Not saved · cloud unavailable. Export JSON backup.');return false;}dirtySnapshot=structuredClone(data);clearTimeout(syncingTimer);syncingTimer=setTimeout(persistSnapshot,300);syncLabel();return true;}
const customers=()=>data.customers.slice().sort((a,b)=>a.name.localeCompare(b.name));
const products=()=>data.products.slice().sort((a,b)=>a.sku.localeCompare(b.sku));
const getCustomer=(id)=>data.customers.find(x=>x.id===id);
const getProduct=(id)=>data.products.find(x=>x.id===id);
const getDoc=(id)=>data.documents.find(x=>x.id===id);

const clamp=(n,min,max)=>Math.max(min,Math.min(max,nval(n)));
function effectiveMarkup(p,channel,settings=data.pricing){const key=channel==='retail'?'retailMarkupOverride':'wholesaleMarkupOverride';const v=p[key];return v===''||v===null||v===undefined?clamp(settings[channel==='retail'?'retailMarkup':'wholesaleMarkup'],0,2000):clamp(v,0,2000)}
function effectiveMOQ(p,settings=data.pricing){return Math.max(1,Math.floor(nval(p.moqOverride!==''&&p.moqOverride!==undefined&&p.moqOverride!==null?p.moqOverride:settings.wholesaleMOQ)||1))}
function unitLandedCost(p,currency='THB',settings=data.pricing){const pack=Math.max(1,nval(p.packCount)||10);const hasSupplierCost=nval(p.costUSDPack)>0||nval(p.costTHBPack)>0;if(!hasSupplierCost)return 0;
 const fx=clamp(settings.fxTHBPerUSD,1,1000),feesUSD=clamp(settings.testingUSDPerPack,0,1e7)+clamp(settings.freightUSDPerPack,0,1e7)+clamp(settings.handlingUSDPerPack,0,1e7);
 let packCost=currency==='USD'?nval(p.costUSDPack):(settings.thbCostBasis==='fx'?nval(p.costUSDPack)*fx:nval(p.costTHBPack));
 return amount((packCost+(currency==='USD'?feesUSD:feesUSD*fx))/pack)}
function roundUP(raw,step){if(raw<=0)return 0;step=Math.max(.01,nval(step)||1);return amount(Math.ceil((raw-1e-8)/step)*step)}
function pricingForProduct(p,channel='wholesale',currency='THB',settings=data.pricing){const costUnit=unitLandedCost(p,currency,settings);const markup=effectiveMarkup(p,channel,settings);const overrideKey=(channel==='retail'?'retail':'wholesale')+currency+'Override';const override=p[overrideKey];let price,origin;
 if(override!==''&&override!==undefined&&override!==null&&nval(override)>0){price=amount(override);origin='manual override'}
 else if(costUnit>0){const roundingKey='round'+currency+(channel==='retail'?'Retail':'Wholesale');price=roundUP(costUnit*(1+markup/100),settings[roundingKey]);origin='rounded markup'}
 else {price=amount(currency==='THB'?p.priceTHB:p.priceUSD);origin='legacy price'}
 return {price,costUnit,markup,origin,customMargin:p[channel+'MarkupOverride']!==''&&p[channel+'MarkupOverride']!=null,realizedMarkup:costUnit>0?amount((price/costUnit-1)*100):null,grossMargin:price>0&&costUnit>0?amount((price-costUnit)/price*100):null,moq:effectiveMOQ(p,settings)}}
function wholesaleMOQViolations(d){if(d.salesChannel!=='wholesale')return [];return (d.items||[]).flatMap(r=>{if(!r.productId)return [];const p=getProduct(r.productId);if(!p)return [];const min=effectiveMOQ(p);return nval(r.qty)+1e-8<min?[`${r.sku||p.sku}: ${r.qty} vial(s), minimum ${min}`]:[]})}
function repriceDocumentCatalogLines(){if(!state.draft||readonly())return;for(const row of state.draft.items){const p=getProduct(row.productId);if(!p)continue;const r=pricingForProduct(p,state.draft.salesChannel||'wholesale',state.draft.currency);row.unitPrice=r.price;row.costSnapshot=r.costUnit;row.priceOrigin=r.origin;if((state.draft.salesChannel||'wholesale')==='wholesale'&&nval(row.qty)<r.moq)row.qty=r.moq}refreshLines()}

function lineTotal(row){return amount(nval(row.qty)*nval(row.unitPrice)*(1-Math.min(100,Math.max(0,nval(row.discount)))/100))}
function totals(doc){const subtotal=amount((doc.items||[]).reduce((s,r)=>s+lineTotal(r),0));const vat=doc.vatEnabled?amount(subtotal*nval(doc.vatRate)/100):0;const total=amount(subtotal+vat);const paid=amount((doc.payments||[]).reduce((s,p)=>s+nval(p.amount),0));return {subtotal,vat,total,paid,due:amount(total-paid)}}
function status(doc){if(doc.status==='void')return 'void';if(doc.status==='draft')return 'draft';if(doc.type!=='invoice')return 'sent';const t=totals(doc);if(t.due<=.009)return 'paid';if(doc.dueDate&&doc.dueDate<today())return 'overdue';if(t.paid>0)return 'partial';return 'unpaid'}
const badges={draft:'Draft',sent:'Issued',unpaid:'Unpaid',paid:'Paid',partial:'Part paid',overdue:'Overdue',void:'Voided'};
function badge(st){return `<span class="pill ${h(st)}">${h(badges[st]||st)}</span>`}
const typename={invoice:'Invoice',quote:'Quotation',proforma:'Proforma'};
function events(doc,action){doc.history=doc.history||[];doc.history.push({date:new Date().toISOString(),action})}
function nextNumber(type,date){const year=(date||today()).slice(0,4);const key=type+'-'+year;data.sequences[key]=(data.sequences[key]||0)+1;const prefix=type==='invoice'?data.settings.invoicePrefix:type==='quote'?data.settings.quotePrefix:data.settings.proformaPrefix;return `${prefix||'DOC'}-${year}-${String(data.sequences[key]).padStart(4,'0')}`}

function renderLines(){const d=state.draft,issued=readonly(),disabled=issued?'disabled':'';if(!d.items.length)return `<div class="empty" style="padding:22px"><strong>No items added</strong><p>Choose an item from the catalog or add a custom charge.</p>${!issued?btn('add-item','＋ Add first item','primary'):''}</div>`;

p="0.1" class="tiny-field" aria-label="Discount ${i+1}" data-item="discount" value="${h(row.discount)}" ${disabled}></td><td class="right" style="white-space:nowrap" data-row-amount="${i}">${fmt(lineTotal(row),d.currency)}</td><td>${!issued?`<button class="btn small danger" aria-label="Remove line ${i+1}" data-act="remove-item" data-index="${i}">×</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}
function renderTotals(d){const t=totals(d);return `<div class="money-block"><div class="money-row"><span>Subtotal</span><strong>${fmt(t.subtotal,d.currency)}</strong></div><div class="money-row"><span>VAT (${d.vatEnabled?`${nval(d.vatRate)}%`:'not applied'})</span><strong>${fmt(t.vat,d.currency)}</strong></div><div class="money-row total"><span>Total</span><strong>${fmt(t.total,d.currency)}</strong></div>${d.type==='invoice'?`<div class="money-row"><small>Payments recorded</small><strong>${fmt(t.paid,d.currency)}</strong></div><div class="money-row due"><span>Balance due</span><strong>${fmt(Math.max(0,t.due),d.currency)}</strong></div>`:''}</div>`}
function renderPayments(d){const t=totals(d);return `${d.payments.length?`<div class="stack">${d.payments.map(p=>`<div class="keyline"><div><strong>${fmt(p.amount,d.currency)}</strong><div class="footnote">${labelDate(p.date)} · ${h(p.method)} ${p.reference?'· '+h(p.reference):''}</div></div></div>`).join('')}</div>`:'<p class="muted smalltext">No payments yet.</p>'}<div class="divider"></div><div class="keyline"><strong>Remaining</strong><strong class="display-amount">${fmt(Math.max(0,t.due),d.currency)}</strong></div>${d.status==='issued'&&t.due>.009?`<div style="margin-top:12px">${btn('new-payment','＋ Record payment','primary small')}</div>`:''}`}
function refreshLines(){const s=document.getElementById('lineSection');if(s)s.innerHTML=renderLines();refreshTotals()}
function refreshTotals(){const d=state.draft;if(!d)return;const el=document.getElementById('totalsSection');if(el)el.innerHTML=renderTotals(d);document.querySelectorAll('[data-row-amount]').forEach(x=>x.textContent=fmt(lineTotal(d.items[nval(x.dataset.rowAmount)]),d.currency));}
function setCustomer(id){const d=state.draft;d.customerId=id;const c=getCustomer(id);if(c){d.customerName=c.name;d.customerAddress=c.address||'';d.customerTaxId=c.taxId||'';d.customerEmail=c.email||'';d.shippingAddress=c.shipping||c.address||'';d.currency=c.currency||data.settings.defaultCurrency||'THB';d.salesChannel=c.salesChannel||'wholesale';d.dueDate=plusDays(d.issueDate,nval(c.terms??data.settings.defaultTerms));d.terms=`Payment due within ${nval(c.terms??data.settings.defaultTerms)} days.`;for(const row of d.items){const p=getProduct(row.productId);if(!p)continue;const r=pricingForProduct(p,d.salesChannel,d.currency);row.unitPrice=r.price;row.costSnapshot=r.costUnit;if(d.salesChannel==='wholesale'&&nval(row.qty)<r.moq)row.qty=r.moq}}else{d.customerName='';d.customerAddress='';d.customerTaxId='';d.customerEmail='';d.shippingAddress=''}render()}
function setProduct(i,id){const d=state.draft,row=d.items[i],p=getProduct(id);if(!row)return;row.productId=id;if(p){row.sku=p.sku;row.description=p.name+(p.spec?' · '+p.spec:'');row.unit=p.unit||'vial';const pr=pricingForProduct(p,d.salesChannel||'wholesale',d.currency);row.unitPrice=pr.price;row.costSnapshot=pr.costUnit;row.priceOrigin=pr.origin;if(d.salesChannel!=='retail'&&nval(row.qty)<pr.moq)row.qty=pr.moq;row.lot=p.defaultLot||'';row.expiry=p.expiry||'';row.coa=p.coa||''}refreshLines()}
function validateIssue(d){if(!data.settings.sellerName.trim())return 'Add your seller business name in Settings.';if(!data.settings.sellerAddress.trim())return 'Add your seller billing address in Settings.';if(!d.customerName.trim()||!d.customerAddress.trim())return 'Select a customer with a billing address.';if(!d.items.length)return 'Add at least one line item.';if(d.items.some(i=>!i.description.trim()||nval(i.qty)<=0||nval(i.unitPrice)<0))return 'Every item needs a description, positive quantity and valid unit price.';if(d.vatEnabled&&!data.settings.vatRegistered)return 'VAT cannot be applied until VAT registration is enabled in Settings.';if(d.vatEnabled&&(!data.settings.sellerTaxId||!data.settings.sellerTaxId.trim()))return 'Add the seller tax identification number to apply VAT.';if(!d.issueDate||!d.dueDate)return 'Both dates are required.';if(d.items.some(i=>nval(i.discount)<0||nval(i.discount)>100))return 'Discount must be between 0% and 100%.';const violations=wholesaleMOQViolations(d);if(violations.length)return 'Wholesale MOQ not met (per SKU):\n'+violations.join('\n');return ''}
function commitDraft(issue=false){const d=state.draft;if(!d||d.status!=='draft')return;const err=issue?validateIssue(d):'';if(err){alert(err);return}if(issue&&!confirm(`Issue this ${typename[d.type].toLowerCase()}? The amount and line items will be locked.`))return;
const existing=getDoc(d.id);const copy=structuredClone(d);copy.updatedAt=new Date().toISOString();if(issue){copy.status='issued';copy.number=nextNumber(copy.type,copy.issueDate);events(copy,'Issued '+copy.number)}else events(copy,existing?'Draft updated':'Draft created');if(existing)Object.assign(existing,copy);else data.documents.push(copy);save();state.draft=structuredClone(copy);render();notify(issue?`Issued ${copy.number}`:'Draft saved')}
function openDoc(id){const d=getDoc(id);if(!d)return;state.draft=structuredClone(d);state.tab='documents';render()}
function duplicateDoc(id){const d=id?getDoc(id):state.draft;if(!d)return;const clone=structuredClone(d);clone.id=uid();clone.status='draft';clone.number='';clone.payments=[];clone.history=[];clone.createdAt=new Date().toISOString();clone.updatedAt=clone.createdAt;clone.issueDate=today();clone.dueDate=plusDays(today(),nval(data.settings.defaultTerms));state.draft=clone;state.tab='documents';render();notify('Editable copy created. Save when ready.')}
function convertDoc(id){const d=id?getDoc(id):state.draft;if(!d||d.type==='invoice')return;const copy=structuredClone(d);copy.id=uid();copy.type='invoice';copy.status='draft';copy.number='';copy.reference=d.number||d.reference||'';copy.payments=[];copy.history=[];copy.issueDate=today();copy.dueDate=plusDays(today(),nval(data.settings.defaultTerms));copy.createdAt=new Date().toISOString();copy.updatedAt=copy.createdAt;state.draft=copy;state.tab='documents';render();notify('Quotation converted to a draft invoice.')}
function voidCurrent(){const d=state.draft;if(!d||d.status!=='issued')return;if(d.type==='invoice'&&totals(d).paid>0){alert('This invoice has recorded payments. Use a documented credit note and refund process in your accounting system instead of voiding it here.');return}if(!confirm('Void this issued document? It remains in the ledger and cannot be edited.'))return;const original=getDoc(d.id);if(!original){alert('Save this document first.');return}original.status='void';original.updatedAt=new Date().toISOString();events(original,'Document voided');save();state.draft=structuredClone(original);render();notify('Document voided and retained in history.')}
function hasUnsavedDraft(){if(!state.draft||state.draft.status!=='draft')return false;const original=getDoc(state.draft.id);return !original||JSON.stringify(state.draft)!==JSON.stringify(original)}
function allowDiscard(){if(pricingDirty()&&!confirm('Leave without saving the price changes?'))return false;state.pricingDraft=null;return !hasUnsavedDraft()||confirm('Discard unsaved draft changes? Save your draft first to keep them.')}
function deleteDraft(){const d=state.draft;if(!d||d.status!=='draft')return;if(!confirm('Delete this draft? This cannot be undone.'))return;data.documents=data.documents.filter(x=>x.id!==d.id);save();state.draft=null;render();notify('Draft removed.')}
function renderCustomers(){const q=state.custSearch.toLowerCase().trim();const list=customers().filter(c=>[c.name,c.email,c.taxId,c.address].join(' ').toLowerCase().includes(q));return head('Buyers & accounts','Customer billing profiles, tax ID, shipping instructions and default payment terms.',btn('add-customer','＋ Add customer','primary'))+`<div class="card"><div class="tools"><input id="custSearch" placeholder="Find customer…" value="${h(state.custSearch)}"></div><div id="custList">${customerTiles(list)}</div></div>`}
function customerTiles(list){return list.length?`<div class="customer-list">${list.map(c=>`<div class="customer-tile"><h3>${h(c.name)}</h3><div class="kicker">${h(c.email||'No email')} · ${h(c.currency||'THB')}</div><p>${h(c.address||'No billing address entered')}</p><div class="footnote">Tax ID: ${h(c.taxId||'—')} · Terms: ${nval(c.terms)} days</div><div class="mini-actions"><button class="linkbtn" data-act="edit-customer" data-id="${h(c.id)}">Edit</button><button class="linkbtn" data-act="new-for-customer" data-id="${h(c.id)}">＋ Invoice</button><button class="linkbtn" data-act="delete-customer" data-id="${h(c.id)}" style="color:#a53f43">Delete</button></div></div>`).join('')}</div>`:'<div class="empty"><strong>No customers found</strong><p>Add a buyer to populate invoice billing details.</p><button class="btn primary" data-act="add-customer">＋ Add customer</button></div>'}
function renderProducts(){const q=state.prodSearch.toLowerCase().trim();const list=products().filter(p=>[p.sku,p.name,p.spec,p.defaultLot].join(' ').toLowerCase().includes(q));return head('Product catalog',`${data.products.length} products, including the Sep 2026 supplier cost list. Quotes and invoices select the wholesale or retail price automatically.`,btn('add-product','＋ Add SKU','primary')+btn('import-open','↑ Import catalog')+btn('nav','Prices & margins · adjust margins','', 'data-tab="pricing"'))+`<div class="notice">Supplier cost is for <strong>10 vials</strong> on every imported line. Prices below are per vial. ${h('UNASSIGNED-063')} is an internal placeholder for Lemon Bottle because the PDF did not list a readable code.</div><div class="card"><div class="tools"><input id="prodSearch" placeholder="Search SKU, name, specification..." value="${h(state.prodSearch)}"></div><div id="prodList">${productTable(list)}</div></div>`}
function productTable(list){return list.length?`<div class="table-scroll"><table class="price-lab-table"><thead><tr><th>SKU</th><th>Product</th><th>Supplier cost / 10 vials</th><th>Wholesale / vial (THB)</th><th>Retail / vial (THB)</th><th>Wholesale MOQ</th><th>Action</th></tr></thead><tbody>${list.map(p=>{const w=pricingForProduct(p,'wholesale'),r=pricingForProduct(p,'retail');return `<tr><td><strong>${h(p.sku)}</strong>${p.sku==='UNASSIGNED-063'?'<span class="chip">Check code</span>':''}</td><td>${h(p.name)}<small>${h(p.spec||'')}</small></td><td>${fmt(p.costTHBPack||0,'THB')}<small>${fmt(p.costUSDPack||0,'USD')} / pack</small></td><td class="pricetag">${fmt(w.price)}</td><td class="pricetag">${fmt(r.price)}</td><td>${w.moq} vials</td><td><button class="linkbtn" data-act="edit-product" data-id="${h(p.id)}">Edit ↗</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty"><strong>No products match</strong><p>Try a different SKU or product name.</p></div>'}
// Price lab: all calculations are recomputed client-side whenever the levers move.
function priceLever(key,title,description,min,max,step){const v=priceSettings()[key];return `<div class="lever"><h3>${title}</h3><p>${description}</p><div class="paired"><input data-price="${key}" type="range" min="${min}" max="${max}" step="${step}" value="${h(v)}" aria-label="${title} slider"><input data-price="${key}" type="number" min="${min}" max="${max}" step="${step}" value="${h(v)}" required aria-label="${title} numeric input"></div></div>`}
function priceSelect(key,title,desc,values){return `<div class="lever"><h3>${title}</h3><p>${desc}</p><select data-price="${key}" aria-label="${title}">${values.map(([v,label])=>`<option value="${h(v)}" ${String(priceSettings()[key])===String(v)?'selected':''}>${h(label)}</option>`).join('')}</select></div>`}
function renderPricing(){if(!state.pricingDraft)state.pricingDraft={...defaultPricing(),...data.pricing};return head('Prices & margins','Choose your margins. Preview the prices. Save once for everyone.',btn('export-wholesale','↓ Buyer wholesale CSV','primary')+btn('export-retail','↓ Buyer retail CSV')+btn('export-catalog','↓ Internal cost CSV')+btn('export-backup','↓ Backup'))+`

${priceSelect('roundUSDWholesale','Wholesale USD rounding','A separate dollar increment; USD prices are not conversions of the final THB sell price.',[[0.5,'Next $0.50'],[1,'Next $1 · default'],[2,'Next $2'],[5,'Next $5'],[10,'Next $10'],[25,'Next $25']])}

</div><p class="footnote">Cost per pack is divided by each product’s pack quantity. Fixed product prices take priority over margin targets. These settings apply after you save.</p></details>

function renderPricingStats(){const settings=priceSettings();const rows=data.products.filter(p=>unitLandedCost(p,'THB',settings)>0),wh=rows.map(p=>pricingForProduct(p,'wholesale','THB',settings)),rt=rows.map(p=>pricingForProduct(p,'retail','THB',settings));const avg=a=>a.length?amount(a.reduce((s,v)=>s+(v.grossMargin||0),0)/a.length):0;
return `<div class="price-metrics"><div><small>Products with costs</small><strong>${rows.length}</strong><small>Source dated 29 Sep 2026</small></div><div><small>Average wholesale gross margin</small><strong>${avg(wh)}%</strong><small>After rounding, before discounts/tax</small></div><div><small>Average retail gross margin</small><strong>${avg(rt)}%</strong><small>After rounding, before discounts/tax</small></div></div>`}
function renderPricingPreview(){const settings=priceSettings();const q=state.pricingSearch.toLowerCase().trim();const list=products().filter(p=>[p.sku,p.name,p.spec].join(' ').toLowerCase().includes(q)).sort((a,b)=>(a.sourceRow||9999)-(b.sourceRow||9999));const pages=Math.max(1,Math.ceil(list.length/25));state.pricingPage=Math.min(Math.max(0,state.pricingPage),pages-1);const slice=list.slice(state.pricingPage*25,(state.pricingPage+1)*25);
return `<div class="table-scroll"><table class="price-lab-table"><thead><tr><th>SKU / strength</th><th>Cost/vial THB</th><th>Wholesale/vial THB</th><th>Retail/vial THB</th><th>Wholesale/vial USD</th><th>Retail/vial USD</th><th>MOQ</th><th></th></tr></thead><tbody>${slice.map(p=>{const w=pricingForProduct(p,'wholesale','THB',settings),r=pricingForProduct(p,'retail','THB',settings),wu=pricingForProduct(p,'wholesale','USD',settings),ru=pricingForProduct(p,'retail','USD',settings);return `<tr><td><strong>${h(p.sku)}</strong><small>${h(p.name)} · ${h(p.spec)}</small></td><td class="cost">${fmt(w.costUnit)}</td><td><span class="pricetag">${fmt(w.price)}</span>${profitNote(w,'THB')}</td><td><span class="pricetag">${fmt(r.price)}</span>${profitNote(r,'THB')}</td><td><strong>${fmt(wu.price,'USD')}</strong>${profitNote(wu,'USD')}</td><td><strong>${fmt(ru.price,'USD')}</strong>${profitNote(ru,'USD')}</td><td>${w.moq} vials</td><td><button class="linkbtn" data-act="product-margins" data-id="${h(p.id)}">Edit margin</button></td></tr>`}).join('')}</tbody></table></div><div class="pricing-pager"><span class="price-mini">${list.length} matches · Page ${state.pricingPage+1} / ${pages}</span><button class="btn small" data-act="pricing-prev" ${state.pricingPage===0?'disabled':''}>← Prev</button><button class="btn small" data-act="pricing-next" ${state.pricingPage===pages-1?'disabled':''}>Next →</button></div>`}
function profitNote(p,currency){return `<small class="price-profit ${p.price<p.costUnit?'negative-profit':''}">${p.costUnit>0?fmt(p.price-p.costUnit,currency)+' profit · '+p.grossMargin+'% margin':'Add cost to calculate profit'}</small>${p.origin==='manual override'?'<small class="override-note">Fixed price</small>':p.customMargin?'<small class="override-note">Product margin override</small>':''}`}
function refreshPricingLab(){refreshMarginExamples();refreshPricingSave();const s=document.getElementById('pricingStats');if(s)s.innerHTML=renderPricingStats();const p=document.getElementById('pricingPreview');if(p)p.innerHTML=renderPricingPreview()}

yle="margin-top:15px"><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" name="vatRegistered" ${s.vatRegistered?'checked':''}> Seller is VAT-registered</label><div class="hint">Enabling this allows VAT on new commercial documents; it does not certify the printout as an official Thai tax invoice.</div></div><div class="field" style="margin-top:15px"><label>Default invoice note</label><textarea name="notes">${h(s.notes)}</textarea></div><div style="margin-top:18px">${btn('save-settings','Save settings','primary')}</div></form>

aleTHBOverride" type="number" min="0" step="0.01" value="${h(p.wholesaleTHBOverride??'')}" placeholder="Auto">`)}${field('Retail fixed price · THB/vial',`<input name="retailTHBOverride" type="number" min="0" step="0.01" value="${h(p.retailTHBOverride??'')}" placeholder="Auto">`)}${field('Wholesale fixed price · USD/vial',`<input name="wholesaleUSDOverride" type="number" min="0" step="0.01" value="${h(p.wholesaleUSDOverride??'')}" placeholder="Auto">`)}${field('Retail fixed price · USD/vial',`<input name="retailUSDOverride" type="number" min="0" step="0.01" value="${h(p.retailUSDOverride??'')}" placeholder="Auto">`)}${field('Manual THB/vial (for SKUs without a supplier cost)',`<input name="priceTHB" type="number" step="0.01" min="0" value="${h(p.priceTHB||0)}">`)}${field('Manual USD/vial (for SKUs without a supplier cost)',`<input name="priceUSD" type="number" step="0.01" min="0" value="${h(p.priceUSD||0)}">`)}${field('Default / current lot',`<input name="defaultLot" value="${h(p.defaultLot||'')}">`)}${field('Expiry date',`<input name="expiry" type="date" value="${h(p.expiry||'')}">`)}${field('CoA URL',`<input name="coa" type="url" value="${h(p.coa||'')}" placeholder="https://...">`)}</div><div class="modal-foot">${btn('close-modal','Cancel')}${btn('save-product','Save SKU','primary')}</div></form>`)}
function productMargins(id){const p=getProduct(id);if(!p)return;modalOpen('Margins · '+p.sku,`<form id="marginForm"><input name="id" type="hidden" value="${h(id)}"><p>${h(p.name)} · ${h(p.spec)}</p><p>Leave blank to follow the saved default. Fixed prices below take priority.</p><div class="grid-2">${['wholesale','retail'].map(c=>{const v=p[c+'MarkupOverride'];return field((c==='wholesale'?'Wholesale':'Retail')+' margin %',`<input name="${c}Margin" aria-label="${c==='wholesale'?'Wholesale':'Retail'} product margin" type="number" min="0" max="95" step="any" value="${v===''||v==null?'':shownMargin(v)}" placeholder="Default: ${amount(markupToMargin(data.pricing[c+'Markup']))}%">`)}).join('')}</div><details class="advanced-pricing"><summary>Fixed selling prices · optional</summary><div class="grid-2">${['wholesale','retail'].flatMap(c=>['THB','USD'].map(currency=>field((c==='wholesale'?'Wholesale':'Retail')+' fixed '+currency+' / vial',`<input name="${c+currency}Override" type="number" min="0.01" step="0.01" value="${h(p[c+currency+'Override']??'')}" placeholder="Automatic">`))).join('')}</div><p>Clear a fixed price to use the margin again.</p></details><div class="modal-foot">${btn('close-modal','Cancel')}${btn('save-margins','Save product margins','primary')}</div></form>`)}
function saveMargins(){const f=document.getElementById('marginForm');if(!f.reportValidity())return;const v=Object.fromEntries(new FormData(f)),p=getProduct(v.id);if(!p)return;for(const c of ['wholesale','retail']){const key=c+'MarkupOverride',m=v[c+'Margin'];if(m==='')p[key]='';else if(p[key]===''||p[key]==null||Number(m)!==shownMargin(p[key]))p[key]=marginToMarkup(Number(m));for(const cur of ['THB','USD']){const k=c+cur+'Override';p[k]=v[k]===''?'':amount(v[k]);}}save();modalClose();render();notify('Saving product margins…')}
function paymentModal(){const d=state.draft,t=totals(d);if(!d||d.type!=='invoice'||d.status!=='issued')return;modalOpen('Record customer payment',`<form id="paymentForm"><p class="muted smalltext">Invoice ${h(d.number)} · Balance due ${fmt(Math.max(0,t.due),d.currency)}</p><div class="grid-2">${field('Received on',`<input type="date" name="date" value="${today()}" required>`)}${field(`Amount (${h(d.currency)})`,`<input type="number" step="0.01" min="0.01" max="${Math.max(0,t.due)}" value="${Math.max(0,t.due).toFixed(2)}" name="amount" required>`)}${field('Payment method',`<select name="method"><option>Bank transfer</option><option>Cash</option><option>Card</option><option>Other</option></select>`)}${field('Transaction reference',`<input name="reference" placeholder="Bank / transfer / receipt ID">`)}</div><div class="modal-foot">${btn('close-modal','Cancel')}${btn('save-payment','Record payment','primary')}</div></form>`)}
function saveCustomer(){const form=document.getElementById('customerForm');if(!form.reportValidity())return;const x=Object.fromEntries(new FormData(form));x.name=x.name.trim();x.terms=nval(x.terms);if(!x.name)return;const original=x.id?getCustomer(x.id):null;if(original)Object.assign(original,x);else{x.id=uid();data.customers.push(x)}save();modalClose();render();notify('Buyer saved.');if(state.draft&&state.draft.status==='draft'&&!state.draft.customerId){setCustomer(x.id)}}
function saveProduct(){const form=document.getElementById('productForm');if(!form.reportValidity())return;const x=Object.fromEntries(new FormData(form));x.sku=x.sku.trim();x.name=x.name.trim();x.priceTHB=amount(x.priceTHB);x.priceUSD=amount(x.priceUSD);x.costUSDPack=amount(x.costUSDPack);x.costTHBPack=amount(x.costTHBPack);x.packCount=Math.max(1,Math.floor(nval(x.packCount)||10));for(const k of ['wholesaleMarkupOverride','retailMarkupOverride','moqOverride','wholesaleTHBOverride','retailTHBOverride','wholesaleUSDOverride','retailUSDOverride'])if(x[k]!==''&&x[k]!==undefined)x[k]=nval(x[k]);if(data.products.some(p=>p.sku.toLowerCase()===x.sku.toLowerCase()&&p.id!==x.id)){alert('SKU is already in the catalog.');return}const original=x.id?getProduct(x.id):null;if(original)Object.assign(original,x);else{x.id=uid();data.products.push(x)}save();modalClose();render();notify('Catalog item saved.')}
function savePayment(){const f=document.getElementById('paymentForm');if(!f.reportValidity())return;const vals=Object.fromEntries(new FormData(f));const amt=amount(vals.amount),d=state.draft,remaining=totals(d).due;if(amt<=0||amt>remaining+.009){alert('Amount must be positive and no more than the unpaid balance.');return}const original=getDoc(d.id);if(!original){alert('Invoice not found.');return}const payment={id:uid(),date:vals.date,amount:amt,method:vals.method,reference:vals.reference,createdAt:new Date().toISOString()};original.payments.push(payment);original.updatedAt=new Date().toISOString();events(original,`Payment recorded: ${fmt(amt,original.currency)}`);save();state.draft=structuredClone(original);modalClose();render();notify('Payment recorded.')}
function saveSettings(){const f=document.getElementById('settingsForm');if(!f.reportValidity())return;const v=Object.fromEntries(new FormData(f));v.vatRegistered=f.elements.vatRegistered.checked;v.defaultTerms=Math.max(0,Math.min(365,nval(v.defaultTerms)));v.vatRate=Math.max(0,Math.min(30,nval(v.vatRate)));for(const key of ['invoicePrefix','quotePrefix','proformaPrefix'])v[key]=(v[key]||'DOC').trim().toUpperCase().replace(/[^A-Z0-9-]/g,'').slice(0,10)||'DOC';data.settings=v;save();render();notify('Business settings saved.')}
function download(filename,text,mime){const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function toCSV(rows){return rows.map(row=>row.map(v=>{const raw=String(v??'');const guarded=typeof v==='string'&&/^[\s]*[=+@-]/.test(raw)?"'"+raw:raw;return '"'+guarded.replaceAll('"','""')+'"'}).join(',')).join('\r\n')}
function exportCSV(){const cols=['Document number','Type','Status','Customer','Buyer tax ID','Issue date','Due date','Currency','Subtotal','VAT','Total','Paid','Balance','PO','Reference','SKUs','Lots'];const rows=data.documents.map(d=>{const t=totals(d);return[d.number||'DRAFT',d.type,status(d),d.customerName,d.customerTaxId,d.issueDate,d.dueDate,d.currency,t.subtotal,t.vat,t.total,t.paid,t.due,d.po,d.reference,d.items.map(i=>i.sku).join(' | '),d.items.map(i=>i.lot).join(' | ')]});download(`wholesale-documents-${today()}.csv`,'\ufeff'+toCSV([cols,...rows]),'text/csv;charset=utf-8');notify('Document CSV downloaded.')}
function mergeCatalog(current,obj){if(!obj||obj.version!==1||!Array.isArray(obj.products)||!obj.products.length)throw Error('Choose a Wholesale Desk catalog JSON file.');const existing=new Set(current.products.map(p=>p.sku.trim().toLowerCase())),ids=new Set(current.products.map(p=>p.id));let added=0,skipped=0;const next=structuredClone(current);for(const source of obj.products){if(!source||typeof source.sku!=='string'||!source.sku.trim()||typeof source.name!=='string'||!source.name.trim())throw Error('A catalog item is missing its SKU or name.');if(existing.has(source.sku.trim().toLowerCase())){skipped++;continue;}if(!Number.isFinite(Number(source.packCount))||Number(source.packCount)<1||!Number.isInteger(Number(source.packCount)))throw Error('Invalid pack quantity for '+source.sku);for(const k of ['costUSDPack','costTHBPack'])if(!Number.isFinite(Number(source[k]))||Number(source[k])<0)throw Error('Invalid supplier cost for '+source.sku);const p=structuredClone(source);p.sku=p.sku.trim();if(typeof p.id!=='string'||!p.id||ids.has(p.id))p.id=uid();ids.add(p.id);existing.add(p.sku.toLowerCase());next.products.push(p);added++;}if(next.products.length>5000)throw Error('Catalog exceeds 5,000 products.');next.sourceListVersion=obj.sourceListVersion||next.sourceListVersion;return {next,added,skipped}}
function catalogImportModal(){modalOpen('Import private catalog',`<p>Add new SKUs to this shared workspace. Existing products, margins, customers and invoices are kept.</p>${btn('catalog-file','Choose catalog JSON file','primary')}<details class="advanced-pricing"><summary>Or paste catalog JSON</summary><label for="catalogPaste">Private catalog JSON</label><textarea id="catalogPaste" spellcheck="false" rows="5" placeholder="Paste the contents of your catalog JSON file"></textarea><p id="catalogImportError" class="margin-error" role="alert"></p>${btn('catalog-paste','Import pasted catalog','primary')}</details>`)}
function applyCatalog(obj){if(!cloudReady||syncLocked)throw Error('Cloud connection unavailable. Reload before importing.');const {next,added,skipped}=mergeCatalog(data,obj);if(!added){notify('No new SKUs · '+skipped+' already in your catalog.');return;}data=next;save();modalClose();state.tab='pricing';state.pricingDraft=null;render();notify('Added '+added+' products · '+skipped+' existing SKUs kept. Saving…');}
function importCatalog(file){const reader=new FileReader();reader.onload=()=>{try{applyCatalog(JSON.parse(reader.result))}catch(e){alert('Catalog not imported: '+e.message)}};reader.readAsText(file)}
function importBackup(file){const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);if(!obj||obj.version!==1||!Array.isArray(obj.documents)||!Array.isArray(obj.customers)||!Array.isArray(obj.products)||!obj.settings)throw new Error('Not a Wholesale Desk backup');if(!confirm(`Replace ALL current records with this backup?\n\n${obj.documents.length} documents, ${obj.customers.length} customers and ${obj.products.length} products. Export your existing data first if needed.`))return;data=Object.assign(initial(),obj);seedSupplierCatalog();save();state.draft=null;state.tab='dashboard';render();notify('Backup restored.')}catch(e){alert('Could not import backup: '+e.message)}};r.readAsText(file)}

function printDoc(doc){if(!doc)return;const s=data.settings,t=totals(doc);const heading=doc.type==='invoice'?'COMMERCIAL INVOICE / ใบแจ้งหนี้':doc.type==='quote'?'QUOTATION / ใบเสนอราคา':'PROFORMA INVOICE';const lines=doc.items.map((it,i)=>`<tr><td>${i+1}</td><td><strong>${h(it.description)}</strong><br><span class="print-small">SKU: ${h(it.sku||'—')}${it.lot?' · Lot: '+h(it.lot):''}${it.expiry?' · Exp: '+h(it.expiry):''}${it.coa?' · CoA: '+(safeLink(it.coa)||h(it.coa)):''}</span></td><td>${h(it.qty)} ${h(it.unit)}</td><td style="text-align:right">${fmt(it.unitPrice,doc.currency)}</td><td style="text-align:right">${nval(it.discount)}%</td><td style="text-align:right">${fmt(lineTotal(it),doc.currency)}</td></tr>`).join('');
document.getElementById('printMount').innerHTML=`<div class="print-head"><div><h1>${heading}${doc.status==='draft'?' · DRAFT':''}${doc.status==='void'?' · VOID':''}</h1><p><strong>${h(s.sellerName||'SELLER NOT CONFIGURED')}</strong></p><p>${h(s.sellerAddress).replaceAll('\n','<br>')}</p><p class="print-small">Tax ID: ${h(s.sellerTaxId||'—')} · ${h(s.sellerEmail||'')} · ${h(s.sellerPhone||'')}</p></div><div style="text-align:right;min-width:145px"><p><strong>${h(doc.number||'Draft / unnumbered')}</strong></p><p>วันที่ / Date: ${labelDate(doc.issueDate)}</p><p>กำหนดชำระ / Due: ${labelDate(doc.dueDate)}</p><p>สกุลเงิน / Currency: ${h(doc.currency)}</p><p>Sales channel: ${h(doc.salesChannel||'wholesale')}</p><p>Status: ${h(badges[status(doc)]||status(doc))}</p></div></div>
<div class="print-meta"><div><h3>ผู้ซื้อ / Bill to</h3><strong>${h(doc.customerName||'—')}</strong><p>${h(doc.customerAddress||'').replaceAll('\n','<br>')}</p><p class="print-small">Tax ID: ${h(doc.customerTaxId||'—')}<br>${h(doc.customerEmail||'')}</p></div><div><h3>จัดส่งถึง / Ship to</h3><p>${h(doc.shippingAddress||'Same as billing').replaceAll('\n','<br>')}</p><p class="print-small">PO: ${h(doc.po||'—')}<br>Reference: ${h(doc.reference||'—')}</p></div></div>
<table class="print-table"><thead><tr><th>#</th><th>รายการ / Description & batch</th><th>จำนวน / Qty</th><th style="text-align:right">ราคา / Price</th><th style="text-align:right">Disc.</th><th style="text-align:right">ยอด / Amount</th></tr></thead><tbody>${lines}</tbody></table><div class="avoid-break"><div class="print-totals"><div><span>ยอดก่อนภาษี / Subtotal</span><strong>${fmt(t.subtotal,doc.currency)}</strong></div><div><span>VAT / ภาษี (${doc.vatEnabled?nval(doc.vatRate)+'%':'not applied'})</span><strong>${fmt(t.vat,doc.currency)}</strong></div><div class="grand"><span>รวมสุทธิ / Total</span><strong>${fmt(t.total,doc.currency)}</strong></div>${doc.type==='invoice'?`<div><span>ยอดชำระ / Payments</span><strong>${fmt(t.paid,doc.currency)}</strong></div><div><strong>ยอดค้างชำระ / Due</strong><strong>${fmt(Math.max(0,t.due),doc.currency)}</strong></div>`:''}</div></div>
<div class="print-footer avoid-break"><div style="display:flex;gap:25px"><div style="flex:1"><strong>ข้อมูลการชำระเงิน / Payment instructions</strong><p>${h(s.bankDetails||'Contact seller for payment instructions').replaceAll('\n','<br>')}</p></div><div style="flex:1"><strong>เงื่อนไข / Terms</strong><p>${h(doc.terms||'').replaceAll('\n','<br>')}</p>${doc.notes?`<strong>หมายเหตุ / Notes</strong><p>${h(doc.notes).replaceAll('\n','<br>')}</p>`:''}</div></div><p class="print-caveat">Commercial invoice / quotation document. Not a digitally certified Thai e-Tax invoice or substitute for any separately required tax document.</p></div>`;
window.print()}
// Delegated UI controls: all form mutations feed a single in-memory draft, snapshots persist only when saved.
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,id=b.dataset.id;switch(act){
case 'nav':if(!allowDiscard())break;state.tab=b.dataset.tab;state.draft=null;render();break;
case 'new-invoice':case 'new-quote':case 'new-proforma':state.draft=newDoc(act.split('-')[1]==='quote'?'quote':act.split('-')[1]==='proforma'?'proforma':'invoice');state.tab='documents';render();break;
case 'back-docs':if(!allowDiscard())break;state.draft=null;render();break;
case 'add-item':addItem();break;
case 'remove-item':state.draft.items.splice(nval(b.dataset.index),1);refreshLines();break;
case 'save-draft':commitDraft(false);break;
case 'issue-doc':commitDraft(true);break;
case 'open-doc':openDoc(id);break;
case 'duplicate-doc':duplicateDoc(id);break;
case 'duplicate-current':duplicateDoc();break;
case 'convert-doc':convertDoc(id);break;
case 'convert-current':convertDoc();break;
case 'void-current':voidCurrent();break;
case 'delete-current':deleteDraft();break;
case 'print-id':printDoc(getDoc(id));break;
case 'print-current':printDoc(state.draft);break;
case 'new-payment':paymentModal();break;
case 'add-customer':customerModal();break;
case 'edit-customer':customerModal(id);break;
case 'save-customer':saveCustomer();break;
case 'delete-customer':if(data.documents.some(d=>d.customerId===id)){alert('Buyer is referenced by a document and cannot be removed.');break}if(confirm('Delete this buyer profile?')){data.customers=data.customers.filter(x=>x.id!==id);save();render();notify('Buyer deleted.')}break;
case 'new-for-customer':state.draft=newDoc('invoice');setCustomer(id);state.tab='documents';render();break;
case 'add-product':productModal();break;
case 'edit-product':productModal(id);break;
case 'save-product':saveProduct();break;
case 'delete-product':if(confirm('Delete this catalog item? Existing document line snapshots will remain.')){data.products=data.products.filter(x=>x.id!==id);save();render();notify('SKU deleted.')}break;
case 'save-payment':savePayment();break;
case 'product-margins':if(!document.getElementById('pricingForm').reportValidity())break;productMargins(id);break;
case 'save-margins':saveMargins();break;
case 'margin-preset':{const t=document.getElementById(b.dataset.channel+'Margin');t.value=b.dataset.value;t.dispatchEvent(new Event('input',{bubbles:true}));break;}
case 'apply-pricing':applyPricing();break;
case 'discard-pricing':state.pricingDraft={...data.pricing};render();break;
case 'save-settings':saveSettings();break;
case 'close-modal':modalClose();break;
case 'export-backup':exportBackup();break;
case 'export-csv':exportCSV();break;
case 'import-open':catalogImportModal();break;
case 'catalog-file':document.getElementById('catalogFile')?.click();break;
case 'catalog-paste':try{applyCatalog(JSON.parse(document.getElementById('catalogPaste').value));}catch(e){document.getElementById('catalogImportError').textContent=e.message;}break;
case 'restore-open':document.getElementById('importFile')?.click();break;
case 'demo-data':addDemo();break;
case 'export-catalog':exportCatalog();break;
case 'export-wholesale':exportBuyerPriceList('wholesale');break;
case 'export-retail':exportBuyerPriceList('retail');break;
case 'pricing-prev':state.pricingPage=Math.max(0,state.pricingPage-1);refreshPricingLab();break;
case 'pricing-next':state.pricingPage++;refreshPricingLab();break;
case 'reset-pricing':if(confirm('Reset global markup, MOQ, cost assumptions and price rounding? Per-SKU overrides and historical documents are untouched.')){data.pricing=defaultPricing();save();render();notify('Global pricing reset.')}break;
}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.price){if(t.tagName==='SELECT'){const k=t.dataset.price;priceSettings()[k]=['thbCostBasis'].includes(k)?t.value:nval(t.value);refreshPricingLab();}return;}if(t.dataset.doc&&state.draft&&!readonly()){
if(t.dataset.doc==='customerId'){setCustomer(t.value);return}
if(['currency','salesChannel'].includes(t.dataset.doc)&&state.draft.items.length){const ok=confirm('Reprice selected catalog items for the new currency/channel? Custom lines will not be converted. You can adjust prices manually before issuing.');if(!ok){t.value=state.draft[t.dataset.doc]||'wholesale';return}}
state.draft[t.dataset.doc]=t.type==='checkbox'?t.checked:t.value;if(['currency','salesChannel'].includes(t.dataset.doc)){repriceDocumentCatalogLines();render();}else refreshTotals();return}
if(t.dataset.item&&state.draft&&!readonly()){const tr=t.closest('[data-line]'),i=nval(tr?.dataset.line);if(t.dataset.item==='productId'){setProduct(i,t.value);return}state.draft.items[i][t.dataset.item]=t.value;refreshTotals();return}
if(t.id==='docFilter'){state.filter=t.value;const el=document.getElementById('docTableWrap');if(el)el.innerHTML=docsTable()}
if(t.id==='catalogFile'&&t.files[0]){importCatalog(t.files[0]);t.value=''}
if(t.id==='importFile'&&t.files[0]){importBackup(t.files[0]);t.value=''}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.margin){if(!t.checkValidity())return;priceSettings()[t.dataset.margin+'Markup']=marginToMarkup(Number(t.value));refreshPricingLab();return;}if(t.dataset.price&&t.tagName==='INPUT'){if(!t.checkValidity()||t.value==='')return;const key=t.dataset.price;const val=nval(t.value);priceSettings()[key]=val;document.querySelectorAll('[data-price="'+key+'"]').forEach(x=>{if(x!==t)x.value=String(val)});refreshPricingLab();return;}if(t.id==='pricingSearch'){state.pricingSearch=t.value;state.pricingPage=0;refreshPricingLab();return;}if(t.dataset.doc&&state.draft&&!readonly()){state.draft[t.dataset.doc]=t.type==='checkbox'?t.checked:t.value;refreshTotals()}
if(t.dataset.item&&state.draft&&!readonly()){const i=nval(t.closest('[data-line]')?.dataset.line);if(state.draft.items[i])state.draft.items[i][t.dataset.item]=t.value;refreshTotals()}
if(t.id==='docSearch'){state.search=t.value;const el=document.getElementById('docTableWrap');if(el)el.innerHTML=docsTable()}
if(t.id==='custSearch'){state.custSearch=t.value;const el=document.getElementById('custList');if(el)el.innerHTML=customerTiles(customers().filter(c=>[c.name,c.email,c.taxId,c.address].join(' ').toLowerCase().includes(state.custSearch.toLowerCase().trim())))}
if(t.id==='prodSearch'){state.prodSearch=t.value;const el=document.getElementById('prodList');if(el)el.innerHTML=productTable(products().filter(p=>[p.sku,p.name,p.spec,p.defaultLot].join(' ').toLowerCase().includes(state.prodSearch.toLowerCase().trim())))}
});
document.addEventListener('submit',e=>{if(['customerForm','productForm','paymentForm','settingsForm','pricingForm','marginForm'].includes(e.target.id))e.preventDefault()});
window.addEventListener('beforeunload',e=>{if(pricingDirty()||hasUnsavedDraft()||saveInFlight||dirtySnapshot||syncLocked){e.preventDefault();e.returnValue=''}});
connectCloud();
})();
</script>
<script>
let installEvent=null;
window.addEventListener('beforeinstallprompt', e=>{e.preventDefault();installEvent=e;});
document.addEventListener('click',async e=>{
 if(!e.target.closest('[data-act="install-app"]'))return;
 if(installEvent){const p=installEvent;installEvent=null;await p.prompt();}
 else alert('Install: on iPhone use Safari → Share → Add to Home Screen. On Android/Chrome use the menu → Install app. On desktop use the browser Install icon.');
});
// No service worker: confidential records are never cached for offline access.
</script>
